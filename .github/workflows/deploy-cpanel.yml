name: Deploy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full_mirror:
        description: >-
          Re-mirror every api/ file instead of planning from the git diff. Needed
          when a file is missing remotely while api/.deploy-sha already claims the
          current commit, because a diff-derived plan has nothing to upload.
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

# Ops: push to main retriggers this workflow when manual dispatch/rerun is unavailable.

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: 24
      LOCAL_DIST_DIR: ./dist/
      LOCAL_REPO_DIR: ${{ github.workspace }}
      REMOTE_TARGET_DIR: .
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_APP_BASE_PATH: /personelmedisa/
          VITE_API_MODE: real
          VITE_DEMO_API_FALLBACK: "false"
          VITE_ENABLE_DIAGNOSTICS: "false"
        run: npm run build

      - name: Validate SPA rewrite file
        run: |
          test -f dist/.htaccess || (echo "dist/.htaccess missing. SPA routes will 404." && exit 1)

      - name: Validate PHP API deploy files
        run: |
          test -f api/.htaccess || (echo "api/.htaccess missing." && exit 1)
          test -f api/public/index.php || (echo "api/public/index.php missing." && exit 1)
          test -f api/src/Router.php || (echo "api/src/Router.php missing." && exit 1)
          test -f api/src/Database/MigrationRunner.php || (echo "MigrationRunner missing." && exit 1)
          test -f api/src/Database/migration_ledger.sql || (echo "Migration ledger bootstrap missing." && exit 1)
          test -f api/migrations/067_personel_canonical_reference_gate.sql || (echo "Migration 067 missing." && exit 1)
          test -f api/migrations/068_sgk_actor_identity_lifecycle_audit.sql || (echo "Migration 068 missing." && exit 1)
          test -f api/bin/migrate.php || (echo "CLI migration runner missing." && exit 1)
          test -f api/bin/cpanel-migration-cron.php || (echo "Cron migration worker missing." && exit 1)
          test -f api/runtime/.htaccess || (echo "Protected runtime deny file missing." && exit 1)
          test ! -f api/config.local.php || (echo "api/config.local.php must not be committed or deployed from repo." && exit 1)

      - name: Generate canonical migration bundle
        run: npm run generate:migration-bundle

      - name: Validate canonical migration bundle
        run: |
          test -s api/runtime-build/canonical-migrations.php || (echo "Canonical migration bundle missing." && exit 1)
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const bundle = readFileSync('api/runtime-build/canonical-migrations.php', 'utf8'); for (const marker of [\"'version' => '000'\", \"'name' => '067_personel_canonical_reference_gate.sql'\", \"'name' => '068_sgk_actor_identity_lifecycle_audit.sql'\"]) { if (!bundle.includes(marker)) throw new Error('Canonical migration bundle marker missing: ' + marker); }"

      - name: Validate deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test -n "$FTP_PORT" || (echo "FTP_PORT secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)
          test -n "$SMOKE_AUTH_USERNAME" || (echo "SMOKE_AUTH_USERNAME secret is missing." && exit 1)
          test -n "$SMOKE_AUTH_PASSWORD" || (echo "SMOKE_AUTH_PASSWORD secret is missing." && exit 1)

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Local lftp directory preflight
        env:
          LOCAL_DIST_DIR: ${{ env.LOCAL_DIST_DIR }}
          LOCAL_REPO_DIR: ${{ env.LOCAL_REPO_DIR }}
        run: |
          set -euo pipefail

          DIST_ABS="$(realpath "${LOCAL_DIST_DIR%/}")"
          REPO_ABS="$(realpath "$LOCAL_REPO_DIR")"

          test -d "$DIST_ABS"
          test -d "$REPO_ABS"
          test -f "$DIST_ABS/index.html"

          DIST_LCD="$(node --input-type=module -e "import { renderLftpLocalDir } from './scripts/deploy/plan-cpanel-incremental.mjs'; process.stdout.write(renderLftpLocalDir(process.argv[1]));" "$DIST_ABS")"
          REPO_LCD="$(node --input-type=module -e "import { renderLftpLocalDir } from './scripts/deploy/plan-cpanel-incremental.mjs'; process.stdout.write(renderLftpLocalDir(process.argv[1]));" "$REPO_ABS")"

          echo "LOCAL_DIST_ABS=${DIST_ABS}"
          echo "LOCAL_REPO_ABS=${REPO_ABS}"
          echo "LOCAL_DIST_LCD=${DIST_LCD}"
          echo "LOCAL_REPO_LCD=${REPO_LCD}"

          # No FTP credentials: proves lftp local-directory parser accepts rendered lcd paths.
          lftp -e "
            set cmd:fail-exit true;
            lcd ${DIST_LCD};
            lpwd;
            lcd ${REPO_LCD};
            lpwd;
            bye
          "
          echo "LOCAL_LFTP_PREFLIGHT=PASS"

      - name: Upload dist and PHP API to cPanel personelmedisa FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          LOCAL_DIST_DIR: ${{ env.LOCAL_DIST_DIR }}
          LOCAL_REPO_DIR: ${{ env.LOCAL_REPO_DIR }}
          REMOTE_TARGET_DIR: ${{ env.REMOTE_TARGET_DIR }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          FORCE_FULL_MIRROR: ${{ inputs.force_full_mirror == true && 'true' || 'false' }}
        run: |
          set -euo pipefail

          PLAN_DIR="$RUNNER_TEMP/cpanel-deploy-plan"
          mkdir -p "$PLAN_DIR"
          DEPLOY_SHA_LOCAL="$PLAN_DIR/.deploy-sha"
          printf '%s\n' "$DEPLOY_SHA" > "$DEPLOY_SHA_LOCAL"

          render_lftp_get() {
            local remote_path="$1"
            local local_path="$2"
            node --input-type=module -e "import { renderLftpGetCommand } from './scripts/deploy/plan-cpanel-incremental.mjs'; process.stdout.write(renderLftpGetCommand({ remotePath: process.argv[1], localPath: process.argv[2] }));" "$remote_path" "$local_path"
          }

          classify_lftp_read_log() {
            local log_file="$1"
            local local_path="$2"
            local exit_code="$3"
            node --input-type=module -e "import { classifyLftpReadLog } from './scripts/deploy/plan-cpanel-incremental.mjs'; const fs = await import('node:fs'); const text = fs.readFileSync(process.argv[1], 'utf8'); process.stdout.write(classifyLftpReadLog(text, { localPath: process.argv[2], exitCode: Number(process.argv[3]) }));" "$log_file" "$local_path" "$exit_code"
          }

          sanitize_lftp_error_detail() {
            local log_file="$1"
            node --input-type=module -e "import { sanitizeLftpErrorDetail } from './scripts/deploy/plan-cpanel-incremental.mjs'; const fs = await import('node:fs'); const text = fs.readFileSync(process.argv[1], 'utf8'); process.stdout.write(sanitizeLftpErrorDetail(text));" "$log_file"
          }

          deploy_with_ftp_mode() {
            local ftp_commands="$1"

            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow false;
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              ${ftp_commands}
              bye
            "
          }

          # shellcheck source=scripts/deploy/cpanel-ftp-readback-lib.sh
          source "${GITHUB_WORKSPACE}/scripts/deploy/cpanel-ftp-readback-lib.sh"

          run_cpanel_ftp() {
            local ftp_commands="$1"
            run_cpanel_ftp_diagnosed "$ftp_commands" ""
          }

          # shellcheck source=scripts/deploy/cpanel-ftp-directory-lib.sh
          source "${GITHUB_WORKSPACE}/scripts/deploy/cpanel-ftp-directory-lib.sh"

          # Canonical GET owner used by previous-SHA, payload verify, and final SHA read-back.
          lftp_get_remote_to_local() {
            local remote_path="$1"
            local local_path="$2"
            local get_cmd
            get_cmd="$(render_lftp_get "$remote_path" "$local_path")"
            echo "LFTP_GET_CMD=${get_cmd}"
            run_cpanel_ftp_diagnosed "cd ${REMOTE_TARGET_DIR}; ${get_cmd};" "$local_path"
          }

          PREVIOUS_DEPLOY_SHA="NONE"
          PREVIOUS_SHA_READ="NOT_FOUND"
          PREVIOUS_SHA_FAILURE_CLASS="NONE"
          previous_sha_file="$PLAN_DIR/previous.deploy-sha"
          rm -f "$previous_sha_file"

          echo "FTP read-back capability + previous SHA probe starting"
          set +e
          lftp_get_remote_to_local "api/.deploy-sha" "$previous_sha_file"
          previous_sha_rc=$?
          set -e
          PREVIOUS_SHA_FAILURE_CLASS="$LAST_READ_CLASS"

          if [[ "$previous_sha_rc" -eq 0 && -s "$previous_sha_file" ]]; then
            PREVIOUS_DEPLOY_SHA="$(tr -d '\r\n' < "$previous_sha_file" || true)"
            if [[ "$PREVIOUS_DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              PREVIOUS_SHA_READ="SUCCESS"
              PREVIOUS_SHA_FAILURE_CLASS="SUCCESS"
            else
              PREVIOUS_SHA_READ="INVALID_CONTENT"
              PREVIOUS_DEPLOY_SHA="NONE"
              PREVIOUS_SHA_FAILURE_CLASS="SUCCESS"
            fi
          elif [[ "$LAST_READ_CLASS" == "REMOTE_NOT_FOUND" ]]; then
            PREVIOUS_SHA_READ="NOT_FOUND"
            PREVIOUS_DEPLOY_SHA="NONE"
            PREVIOUS_SHA_FAILURE_CLASS="REMOTE_NOT_FOUND"
          else
            PREVIOUS_SHA_READ="TRANSPORT_FAILED"
            PREVIOUS_DEPLOY_SHA="NONE"
            PREVIOUS_SHA_FAILURE_CLASS="$LAST_READ_CLASS"
          fi

          echo "PREVIOUS_SHA_READ=${PREVIOUS_SHA_READ}"
          echo "PREVIOUS_SHA_FAILURE_CLASS=${PREVIOUS_SHA_FAILURE_CLASS}"
          if [[ "$PREVIOUS_SHA_READ" == "SUCCESS" ]]; then
            echo "PREVIOUS_SHA_VALUE=${PREVIOUS_DEPLOY_SHA}"
          fi

          # Transport/protocol/local-output GET failure is fatal BEFORE bulk upload.
          # REMOTE_NOT_FOUND is not fatal: GET reached the server (capability proven).
          if [[ "$PREVIOUS_SHA_READ" == "TRANSPORT_FAILED" ]]; then
            echo "FTP_READBACK_PREFLIGHT=FAIL"
            echo "REFUSING_BULK_UPLOAD=YES"
            echo "READBACK_FAILURE_CLASS=${PREVIOUS_SHA_FAILURE_CLASS}"
            exit 1
          fi
          echo "FTP_READBACK_PREFLIGHT=PASS"

          node scripts/deploy/plan-cpanel-incremental.mjs \
            --previous-sha="$PREVIOUS_DEPLOY_SHA" \
            --previous-sha-read-status="$PREVIOUS_SHA_READ" \
            --force-full-mirror="$FORCE_FULL_MIRROR" \
            --current-sha="$DEPLOY_SHA" \
            --repo-root="$LOCAL_REPO_DIR" \
            --dist-dir="${LOCAL_DIST_DIR%/}" \
            --out-dir="$PLAN_DIR" \
            --deploy-sha-local-path="$DEPLOY_SHA_LOCAL" \
            --remote-target-dir="$REMOTE_TARGET_DIR"

          # shellcheck disable=SC1091
          set -a
          # summary.env is KEY=VALUE lines without secrets
          source "$PLAN_DIR/summary.env"
          set +a

          echo "DEPLOY_MODE=${DEPLOY_MODE}"
          echo "PREVIOUS_DEPLOY_SHA=${PREVIOUS_DEPLOY_SHA}"
          echo "PREVIOUS_SHA_READ=${PREVIOUS_SHA_READ}"
          echo "CURRENT_DEPLOY_SHA=${CURRENT_DEPLOY_SHA}"
          echo "API_CHANGED_FILES=${API_CHANGED_FILES}"
          echo "API_UPLOADED_FILES=${API_UPLOADED_FILES}"
          echo "API_DELETED_FILES=${API_DELETED_FILES}"
          echo "UNCHANGED_API_FILES_SKIPPED=${UNCHANGED_API_FILES_SKIPPED}"
          echo "FRONTEND_DEPLOY_MODE=${FRONTEND_DEPLOY_MODE}"
          echo "FRONTEND_FILES_UPLOADED=${FRONTEND_FILES_UPLOADED}"
          echo "FALLBACK_REASON=${FALLBACK_REASON}"

          ACTIVE_COMMANDS="$(cat "$PLAN_DIR/ftp-active.commands")"
          FULL_COMMANDS="$(cat "$PLAN_DIR/ftp-full.commands")"
          FINALIZE_SHA_COMMANDS="$(cat "$PLAN_DIR/ftp-finalize-sha.commands")"
          ACTIVE_DIRECTORY_LIST="$PLAN_DIR/payload-directories-active.list"
          FULL_DIRECTORY_LIST="$PLAN_DIR/payload-directories-full.list"

          # Keep full-mirror command strings discoverable for safety/source contracts:
          # mirror -R --verbose api/public api/public
          # mirror -R --verbose api/src api/src
          # mirror -R --verbose api/bin api/bin
          # mirror -R --verbose api/migrations api/migrations
          # mirror -R --verbose api/runtime-build api/runtime-build
          # Payload transfer NEVER writes api/.deploy-sha.
          # Finalization is a separate FTP operation after payload verify PASS.

          # Reads one uploaded api/ file back and proves byte parity with the commit.
          # Without this an INCREMENTAL put that never landed stays invisible: the
          # marker advances, the frontend expects the new code, and the missing PHP
          # class only surfaces as an empty HTTP 500 in production.
          verify_uploaded_api_file_parity() {
            local relative_path="$1"
            local remote_copy
            remote_copy="$(mktemp)"
            if ! lftp_get_remote_to_local "$relative_path" "$remote_copy"; then
              rm -f "$remote_copy"
              echo "API_FILE_PARITY=FAIL path=${relative_path} reason=${LAST_READ_CLASS}"
              return 1
            fi
            if [[ "$(sha256sum "$remote_copy" | cut -d' ' -f1)" != \
                  "$(sha256sum "${LOCAL_REPO_DIR}/${relative_path}" | cut -d' ' -f1)" ]]; then
              rm -f "$remote_copy"
              echo "API_FILE_PARITY=FAIL path=${relative_path} reason=SHA256_MISMATCH"
              return 1
            fi
            rm -f "$remote_copy"
            echo "API_FILE_PARITY=OK path=${relative_path}"
          }

          verify_payload_before_sha() {
            local remote_bundle_path
            remote_bundle_path="$(mktemp)"
            echo "REMOTE_BUNDLE_GET starting"
            if ! lftp_get_remote_to_local "api/runtime-build/canonical-migrations.php" "$remote_bundle_path"; then
              rm -f "$remote_bundle_path"
              echo "REMOTE_BUNDLE_GET=FAIL reason=${LAST_READ_CLASS}"
              return 1
            fi
            if [[ "$(sha256sum "${remote_bundle_path}" | cut -d' ' -f1)" != \
                  "$(sha256sum "${LOCAL_REPO_DIR}/api/runtime-build/canonical-migrations.php" | cut -d' ' -f1)" ]]; then
              rm -f "$remote_bundle_path"
              echo "REMOTE_BUNDLE_PARITY=FAIL reason=SHA256_MISMATCH"
              return 1
            fi
            rm -f "${remote_bundle_path}"
            echo "REMOTE_BUNDLE_GET=SUCCESS"

            local verified=0
            echo "API_UPLOAD_PARITY starting"
            while IFS= read -r api_path; do
              [[ -z "$api_path" ]] && continue
              verify_uploaded_api_file_parity "$api_path" || return 1
              verified=$((verified + 1))
            done < "$PLAN_DIR/api-uploads.list"
            echo "API_UPLOAD_PARITY=SUCCESS verified=${verified}"
          }

          finalize_deploy_sha() {
            echo "Deploy SHA finalization starting (marker write after payload verify)"
            if ! run_cpanel_ftp "$FINALIZE_SHA_COMMANDS"; then
              echo "FINAL_SHA_WRITE=FAIL"
              return 1
            fi
            local remote_sha_path
            remote_sha_path="$(mktemp)"
            echo "FINAL_SHA_GET starting"
            if ! lftp_get_remote_to_local "api/.deploy-sha" "$remote_sha_path"; then
              rm -f "$remote_sha_path"
              echo "FINAL_SHA_GET=FAIL reason=${LAST_READ_CLASS}"
              return 1
            fi
            if [[ "$(tr -d '\r\n' < "${remote_sha_path}")" != "${DEPLOY_SHA}" ]]; then
              rm -f "$remote_sha_path"
              echo "FINAL_SHA_PARITY=FAIL"
              return 1
            fi
            rm -f "${remote_sha_path}"
            echo "FINAL_SHA_GET=SUCCESS"
            echo "Deploy SHA finalization verified"
          }

          ensure_payload_directories() {
            local label="$1"
            local directory_list="$2"
            local remote_directory

            while IFS= read -r remote_directory; do
              [[ -z "$remote_directory" ]] && continue
              echo "DEPLOY_PAYLOAD_DIRECTORY_ENSURE_START path=${remote_directory} mode=${label}"
              if ! ensure_cpanel_remote_directory_at_root "$REMOTE_TARGET_DIR" "$remote_directory"; then
                echo "DEPLOY_PAYLOAD_DIRECTORY_ENSURE=FAIL path=${remote_directory} mode=${label}"
                return 1
              fi
            done < "$directory_list"
            echo "DEPLOY_PAYLOAD_DIRECTORY_ENSURE=PASS mode=${label}"
          }

          upload_verify_finalize() {
            local label="$1"
            local commands="$2"
            local directory_list="$3"
            if ! ensure_payload_directories "$label" "$directory_list"; then
              return 1
            fi
            echo "Deploy payload transfer path: ${label}"
            if ! run_cpanel_ftp "$commands"; then
              echo "DEPLOY_PAYLOAD_TRANSFER=FAIL path=${label}"
              return 1
            fi
            echo "Deploy payload pre-finalization verify: ${label}"
            if ! verify_payload_before_sha; then
              echo "DEPLOY_PAYLOAD_VERIFY=FAIL path=${label}"
              return 1
            fi
            if ! finalize_deploy_sha; then
              echo "DEPLOY_SHA_FINALIZE=FAIL path=${label}"
              return 1
            fi
            return 0
          }

          if [[ "$DEPLOY_MODE" == "INCREMENTAL" ]]; then
            if ! upload_verify_finalize "INCREMENTAL" "$ACTIVE_COMMANDS" "$ACTIVE_DIRECTORY_LIST"; then
              echo "INCREMENTAL transfer/verify/finalize failed; switching to FULL_MIRROR_FALLBACK"
              echo "FALLBACK_REASON=INCREMENTAL_TRANSFER_OR_VERIFY_FAILED"
              # On incremental failure the production marker must remain the previous SHA
              # until fallback payload verify PASS and a successful finalize.
              upload_verify_finalize "FULL_MIRROR_FALLBACK" "$FULL_COMMANDS" "$FULL_DIRECTORY_LIST"
            fi
          else
            upload_verify_finalize "FULL_MIRROR_FALLBACK" "$FULL_COMMANDS" "$FULL_DIRECTORY_LIST"
          fi

      - name: Verify deployed app with anonymous and authenticated read-only smoke
        env:
          SMOKE_BASE_URL: https://www.karmotors.com.tr
          SMOKE_APP_PREFIX: /personelmedisa
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: npm run smoke:live
