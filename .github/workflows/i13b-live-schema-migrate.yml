name: I13B Live Schema Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "PREFLIGHT_BACKUP_I13B | MIGRATE_I13B_051 | CLEANUP_I13B"
        required: true
        type: string

jobs:
  migrate:
    name: I13B live backup/migrate via temporary FTP ops
    if: >-
      github.event.inputs.confirm == 'PREFLIGHT_BACKUP_I13B' ||
      github.event.inputs.confirm == 'MIGRATE_I13B_051' ||
      github.event.inputs.confirm == 'CLEANUP_I13B'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Validate migration 051 present
        if: github.event.inputs.confirm != 'CLEANUP_I13B'
        run: |
          set -euo pipefail
          test -f api/migrations/051_users_varsayilan_sube_id.sql
          sha256sum api/migrations/051_users_varsayilan_sube_id.sql
          echo "920cc2cbb3e153413b930e8a8ebbb66cea0ffb507eb8da5f6d93506590192911  api/migrations/051_users_varsayilan_sube_id.sql" | sha256sum -c -

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD missing" && exit 1)
          test "${FTP_PORT}" = "21" || (echo "FTP_PORT must be 21" && exit 1)

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare one-shot ops payload
        if: github.event.inputs.confirm != 'CLEANUP_I13B'
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          export TOKEN
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/i13b-ops /tmp/i13b-artifacts
          cp api/migrations/051_users_varsayilan_sube_id.sql /tmp/i13b-ops/
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path('scripts/i13b-live-migrate.php').read_text(encoding='utf-8')
          token = os.environ['TOKEN']
          if src.count('REPLACE_I13B_MIGRATE_TOKEN') != 1:
              raise SystemExit(f"expected exactly 1 REPLACE placeholder, got {src.count('REPLACE_I13B_MIGRATE_TOKEN')}")
          out = src.replace('REPLACE_I13B_MIGRATE_TOKEN', token, 1)
          Path('/tmp/i13b-ops/_i13b_migrate.php').write_text(out, encoding='utf-8', newline='\n')
          print('token_injected_ok')
          PY
          if head -c 3 /tmp/i13b-ops/_i13b_migrate.php | grep -q $'\xEF\xBB\xBF'; then
            echo "BOM detected" && exit 1
          fi
          grep -q "UNSET_I13B_MIGRATE_TOKEN" /tmp/i13b-ops/_i13b_migrate.php
          grep -q "$TOKEN" /tmp/i13b-ops/_i13b_migrate.php
          sha256sum api/migrations/051_users_varsayilan_sube_id.sql | tee /tmp/i13b-artifacts/migration-sha256.txt
          ls -la /tmp/i13b-ops

      - name: Upload ops files via FTP
        if: github.event.inputs.confirm != 'CLEANUP_I13B'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          upload() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 5;
              set net:timeout 30;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd .;
              mkdir -p api/public;
              lcd /tmp/i13b-ops;
              put -O api/public _i13b_migrate.php;
              put -O api/public 051_users_varsayilan_sube_id.sql;
              bye
            "
          }
          upload true || upload false

      - name: Identity + preflight
        if: github.event.inputs.confirm == 'PREFLIGHT_BACKUP_I13B' || github.event.inputs.confirm == 'MIGRATE_I13B_051'
        id: preflight
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_i13b_migrate.php"
          code=$(curl -sS -o /tmp/i13b-artifacts/identity.json -w "%{http_code}" "${BASE}?token=${TOKEN}&action=identity" || true)
          echo "identity_http=$code"
          cat /tmp/i13b-artifacts/identity.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/i13b-artifacts/identity.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          PY
          code=$(curl -sS -o /tmp/i13b-artifacts/preflight.json -w "%{http_code}" "${BASE}?token=${TOKEN}&action=preflight" || true)
          echo "preflight_http=$code"
          cat /tmp/i13b-artifacts/preflight.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/i13b-artifacts/preflight.json'))
          pre=data.get('preflight') or {}
          print(json.dumps({
            'ok': data.get('ok'),
            'code': data.get('code'),
            'already_applied': data.get('already_applied'),
            'fresh_apply_ready': pre.get('fresh_apply_ready'),
            'column_present': pre.get('column_present'),
            'partial_051_trace': pre.get('partial_051_trace'),
            'counts': pre.get('counts'),
          }, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          if data.get('code') == 'I13B_PREFLIGHT_PARTIAL_051_TRACE':
            sys.exit(2)
          open('/tmp/i13b-artifacts/already_applied.txt','w').write('1' if data.get('already_applied') else '0')
          counts = pre.get('counts') or {}
          open('/tmp/i13b-artifacts/before_users.txt','w').write(str(counts.get('users', '')))
          open('/tmp/i13b-artifacts/before_subeler.txt','w').write(str(counts.get('subeler', '')))
          open('/tmp/i13b-artifacts/before_personeller.txt','w').write(str(counts.get('personeller', '')))
          open('/tmp/i13b-artifacts/before_user_subeler.txt','w').write(str(counts.get('user_subeler', '')))
          PY
          if [ "${{ github.event.inputs.confirm }}" = "MIGRATE_I13B_051" ]; then
            if [ "$(cat /tmp/i13b-artifacts/already_applied.txt)" = "1" ]; then
              echo "051 already applied; skipping mutate and recording ALREADY_EFFECTIVE"
              echo "already_effective=1" >> "$GITHUB_OUTPUT"
            else
              echo "already_effective=0" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Backup + download
        if: github.event.inputs.confirm == 'PREFLIGHT_BACKUP_I13B'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_i13b_migrate.php"
          curl -fsS "${BASE}?token=${TOKEN}&action=backup" | tee /tmp/i13b-artifacts/backup.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/i13b-artifacts/backup.json'))
          print(json.dumps({k:data.get(k) for k in ('ok','code','backup')}, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          backup=data.get('backup') or {}
          if backup.get('method') not in ('mysqldump', 'php_sql_dump'):
            raise SystemExit(f"invalid backup method: {backup.get('method')}")
          name=backup.get('file') or 'karmotor_medisa_pre_051.sql'
          open('/tmp/i13b-artifacts/backup_filename.txt','w').write(name)
          open('/tmp/i13b-artifacts/backup_method.txt','w').write(str(backup.get('method') or ''))
          open('/tmp/i13b-artifacts/backup_created_at.txt','w').write(str(backup.get('created_at_utc') or ''))
          PY
          FNAME="$(cat /tmp/i13b-artifacts/backup_filename.txt)"
          curl -fsS "${BASE}?token=${TOKEN}&action=download_backup" -o "/tmp/i13b-artifacts/${FNAME}"
          ls -la "/tmp/i13b-artifacts/${FNAME}"
          python3 - <<PY
          from pathlib import Path
          import hashlib,re
          p=Path('/tmp/i13b-artifacts')/Path(open('/tmp/i13b-artifacts/backup_filename.txt').read().strip())
          text=p.read_text(encoding='utf-8', errors='replace')
          assert p.stat().st_size > 0
          assert 'CREATE TABLE' in text
          assert re.search(r'CREATE TABLE [`"]?users[`"]?', text, re.I)
          assert re.search(r'CREATE TABLE [`"]?subeler[`"]?', text, re.I)
          assert ('COMMIT' in text) or ('Dump completed' in text)
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          open('/tmp/i13b-artifacts/backup_sha256.txt','w').write(h)
          open('/tmp/i13b-artifacts/backup_bytes.txt','w').write(str(p.stat().st_size))
          print('backup verify OK method', open('/tmp/i13b-artifacts/backup_method.txt').read().strip())
          print('bytes', p.stat().st_size)
          print('sha256', h)
          print('create_table_count', text.upper().count('CREATE TABLE'))
          PY

      - name: Apply migration 051
        if: github.event.inputs.confirm == 'MIGRATE_I13B_051' && steps.preflight.outputs.already_effective != '1'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_i13b_migrate.php"
          curl -fsS "${BASE}?token=${TOKEN}&action=migrate" | tee /tmp/i13b-artifacts/migrate.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/i13b-artifacts/migrate.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          post=data.get('postcheck') or {}
          schema=(post.get('schema') or {})
          if not schema.get('already_applied'):
            sys.exit(2)
          if not post.get('counts_unchanged', True):
            sys.exit(3)
          if not post.get('no_backfill_ok', False):
            sys.exit(4)
          PY
          BEFORE_U="$(cat /tmp/i13b-artifacts/before_users.txt)"
          BEFORE_S="$(cat /tmp/i13b-artifacts/before_subeler.txt)"
          BEFORE_P="$(cat /tmp/i13b-artifacts/before_personeller.txt)"
          BEFORE_US="$(cat /tmp/i13b-artifacts/before_user_subeler.txt)"
          curl -fsS "${BASE}?token=${TOKEN}&action=postcheck&before_users=${BEFORE_U}&before_subeler=${BEFORE_S}&before_personeller=${BEFORE_P}&before_user_subeler=${BEFORE_US}" | tee /tmp/i13b-artifacts/postcheck.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/i13b-artifacts/postcheck.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          PY

      - name: Record already-effective skip
        if: github.event.inputs.confirm == 'MIGRATE_I13B_051' && steps.preflight.outputs.already_effective == '1'
        run: |
          set -euo pipefail
          echo '{"ok":true,"code":"I13B_ALREADY_EFFECTIVE","skipped_apply":true}' | tee /tmp/i13b-artifacts/migrate.json
          cp /tmp/i13b-artifacts/preflight.json /tmp/i13b-artifacts/postcheck.json

      - name: Delete ops files via FTP
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cleanup() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit false;
              set net:max-retries 3;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd api/public;
              rm -f _i13b_migrate.php;
              rm -f 051_users_varsayilan_sube_id.sql;
              rm -f i13b_latest_backup_path.txt;
              bye
            "
          }
          if [ "${{ github.event.inputs.confirm }}" != "" ]; then
            cleanup true || cleanup false
          fi
          for mode in true false; do
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit false;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${mode};
              set ftp:ssl-force ${mode};
              set ftp:ssl-protect-data ${mode};
              cd api/public;
              glob rm karmotor_medisa_pre_051_*.sql;
              bye
            " || true
          done
          code=$(curl -sS -o /tmp/gone.txt -w "%{http_code}" "https://www.karmotors.com.tr/personelmedisa/api/public/_i13b_migrate.php" || true)
          echo "post-delete HTTP=$code"

      - name: Upload migrate artifacts
        if: always() && github.event.inputs.confirm != 'CLEANUP_I13B'
        uses: actions/upload-artifact@v4
        with:
          name: i13b-live-schema-migrate-${{ github.event.inputs.confirm }}
          path: /tmp/i13b-artifacts
          if-no-files-found: warn
