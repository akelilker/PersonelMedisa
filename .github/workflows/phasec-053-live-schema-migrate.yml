name: PhaseC 053 Live Schema Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "PREFLIGHT_BACKUP_PHASEC053 | MIGRATE_PHASEC053 | CLEANUP_PHASEC053"
        required: true
        type: string

jobs:
  migrate:
    name: PhaseC 053 live backup/migrate via temporary FTP ops
    if: >-
      github.event.inputs.confirm == 'PREFLIGHT_BACKUP_PHASEC053' ||
      github.event.inputs.confirm == 'MIGRATE_PHASEC053' ||
      github.event.inputs.confirm == 'CLEANUP_PHASEC053'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHORIZED_HEAD: 82f37612cbb28fbe3adf221a786ef4218e6c1b29
      EXPECTED_053_SHA: 5969a777ffd9d59f315139c57b86ee76402084943ce97f26a97f11521947d1af
    steps:
      - name: Checkout ops tooling branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch authorized PR head for migration 053 only
        if: github.event.inputs.confirm != 'CLEANUP_PHASEC053'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${AUTHORIZED_HEAD}"
          mkdir -p /tmp/phasec053-ops /tmp/phasec053-artifacts
          git show "${AUTHORIZED_HEAD}:api/migrations/053_retention_legal_hold_arsiv.sql" > /tmp/phasec053-ops/053_retention_legal_hold_arsiv.sql
          echo "${EXPECTED_053_SHA}  /tmp/phasec053-ops/053_retention_legal_hold_arsiv.sql" | sha256sum -c -
          test -f scripts/phasec-053-live-migrate.php

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD missing" && exit 1)
          test "${FTP_PORT}" = "21" || (echo "FTP_PORT must be 21" && exit 1)

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare one-shot ops payload
        if: github.event.inputs.confirm != 'CLEANUP_PHASEC053'
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          export TOKEN
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path('scripts/phasec-053-live-migrate.php').read_text(encoding='utf-8')
          token = os.environ['TOKEN']
          if src.count('REPLACE_PHASEC053_MIGRATE_TOKEN') != 1:
              raise SystemExit(f"expected exactly 1 REPLACE placeholder, got {src.count('REPLACE_PHASEC053_MIGRATE_TOKEN')}")
          out = src.replace('REPLACE_PHASEC053_MIGRATE_TOKEN', token, 1)
          Path('/tmp/phasec053-ops/_phasec053_migrate.php').write_text(out, encoding='utf-8', newline='\n')
          print('token_injected_ok')
          PY
          if head -c 3 /tmp/phasec053-ops/_phasec053_migrate.php | grep -q $'\xEF\xBB\xBF'; then
            echo "BOM detected" && exit 1
          fi
          grep -q "UNSET_PHASEC053_MIGRATE_TOKEN" /tmp/phasec053-ops/_phasec053_migrate.php
          grep -q "$TOKEN" /tmp/phasec053-ops/_phasec053_migrate.php
          sha256sum /tmp/phasec053-ops/053_retention_legal_hold_arsiv.sql | tee /tmp/phasec053-artifacts/migration-sha256.txt
          ls -la /tmp/phasec053-ops

      - name: Upload ops files via FTP
        if: github.event.inputs.confirm != 'CLEANUP_PHASEC053'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          upload() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 5;
              set net:timeout 30;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd .;
              mkdir -p api/public;
              lcd /tmp/phasec053-ops;
              put -O api/public _phasec053_migrate.php;
              put -O api/public 053_retention_legal_hold_arsiv.sql;
              bye
            "
          }
          upload true || upload false

      - name: Identity + preflight
        if: github.event.inputs.confirm == 'PREFLIGHT_BACKUP_PHASEC053' || github.event.inputs.confirm == 'MIGRATE_PHASEC053'
        id: preflight
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_phasec053_migrate.php"
          code=$(curl -sS -o /tmp/phasec053-artifacts/identity.json -w "%{http_code}" "${BASE}?token=${TOKEN}&action=identity" || true)
          echo "identity_http=$code"
          cat /tmp/phasec053-artifacts/identity.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/phasec053-artifacts/identity.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          PY
          code=$(curl -sS -o /tmp/phasec053-artifacts/preflight.json -w "%{http_code}" "${BASE}?token=${TOKEN}&action=preflight" || true)
          echo "preflight_http=$code"
          cat /tmp/phasec053-artifacts/preflight.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/phasec053-artifacts/preflight.json'))
          pre=data.get('preflight') or {}
          print(json.dumps({
            'ok': data.get('ok'),
            'code': data.get('code'),
            'already_applied': data.get('already_applied'),
            'fresh_apply_ready': pre.get('fresh_apply_ready'),
            'partial_053_trace': pre.get('partial_053_trace'),
            'table_presence': pre.get('table_presence'),
            'business_counts': pre.get('business_counts'),
            'has_051': pre.get('has_051_users_varsayilan_col'),
          }, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          if data.get('code') == 'PHASEC053_PREFLIGHT_PARTIAL_052_TRACE':
            sys.exit(2)
          if data.get('code') == 'PHASEC053_PREFLIGHT_051_MISSING':
            sys.exit(3)
          open('/tmp/phasec053-artifacts/already_applied.txt','w').write('1' if data.get('already_applied') else '0')
          counts = pre.get('business_counts') or {}
          open('/tmp/phasec053-artifacts/before_personeller.txt','w').write(str(counts.get('personeller', '')))
          open('/tmp/phasec053-artifacts/before_gunluk_puantaj.txt','w').write(str(counts.get('gunluk_puantaj', '')))
          open('/tmp/phasec053-artifacts/before_users.txt','w').write(str(counts.get('users', '')))
          open('/tmp/phasec053-artifacts/before_surecler.txt','w').write(str(counts.get('surecler', '')))
          PY
          if [ "${{ github.event.inputs.confirm }}" = "MIGRATE_PHASEC053" ]; then
            if [ "$(cat /tmp/phasec053-artifacts/already_applied.txt)" = "1" ]; then
              echo "053 already applied; skipping mutate and recording ALREADY_EFFECTIVE"
              echo "already_effective=1" >> "$GITHUB_OUTPUT"
            else
              echo "already_effective=0" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Backup + download
        if: github.event.inputs.confirm == 'PREFLIGHT_BACKUP_PHASEC053'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_phasec053_migrate.php"
          curl -fsS "${BASE}?token=${TOKEN}&action=backup" | tee /tmp/phasec053-artifacts/backup.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/phasec053-artifacts/backup.json'))
          print(json.dumps({k:data.get(k) for k in ('ok','code','backup')}, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          backup=data.get('backup') or {}
          if backup.get('method') not in ('mysqldump', 'php_sql_dump'):
            raise SystemExit(f"invalid backup method: {backup.get('method')}")
          name=backup.get('file') or 'karmotor_medisa_pre_052.sql'
          open('/tmp/phasec053-artifacts/backup_filename.txt','w').write(name)
          open('/tmp/phasec053-artifacts/backup_method.txt','w').write(str(backup.get('method') or ''))
          open('/tmp/phasec053-artifacts/backup_created_at.txt','w').write(str(backup.get('created_at_utc') or ''))
          open('/tmp/phasec053-artifacts/db_server_version.txt','w').write(str(backup.get('db_server_version') or ''))
          PY
          FNAME="$(cat /tmp/phasec053-artifacts/backup_filename.txt)"
          curl -fsS "${BASE}?token=${TOKEN}&action=download_backup" -o "/tmp/phasec053-artifacts/${FNAME}"
          ls -la "/tmp/phasec053-artifacts/${FNAME}"
          python3 - <<PY
          from pathlib import Path
          import hashlib,re
          p=Path('/tmp/phasec053-artifacts')/Path(open('/tmp/phasec053-artifacts/backup_filename.txt').read().strip())
          text=p.read_text(encoding='utf-8', errors='replace')
          assert p.stat().st_size > 0
          assert 'CREATE TABLE' in text
          assert re.search(r'CREATE TABLE [`"]?users[`"]?', text, re.I)
          assert re.search(r'CREATE TABLE [`"]?personeller[`"]?', text, re.I)
          assert ('COMMIT' in text) or ('Dump completed' in text)
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          open('/tmp/phasec053-artifacts/backup_sha256.txt','w').write(h)
          open('/tmp/phasec053-artifacts/backup_bytes.txt','w').write(str(p.stat().st_size))
          print('backup verify OK method', open('/tmp/phasec053-artifacts/backup_method.txt').read().strip())
          print('bytes', p.stat().st_size)
          print('sha256', h)
          print('create_table_count', text.upper().count('CREATE TABLE'))
          PY

      - name: Apply migration 053
        if: github.event.inputs.confirm == 'MIGRATE_PHASEC053' && steps.preflight.outputs.already_effective != '1'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa/api/public/_phasec053_migrate.php"
          curl -fsS "${BASE}?token=${TOKEN}&action=migrate" | tee /tmp/phasec053-artifacts/migrate.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/phasec053-artifacts/migrate.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          post=data.get('postcheck') or {}
          schema=(post.get('schema') or {})
          if not schema.get('already_applied'):
            sys.exit(2)
          if not post.get('business_counts_unchanged', True):
            sys.exit(3)
          if not post.get('new_tables_empty_ok', False):
            sys.exit(4)
          PY
          BEFORE_P="$(cat /tmp/phasec053-artifacts/before_personeller.txt)"
          BEFORE_G="$(cat /tmp/phasec053-artifacts/before_gunluk_puantaj.txt)"
          BEFORE_U="$(cat /tmp/phasec053-artifacts/before_users.txt)"
          BEFORE_S="$(cat /tmp/phasec053-artifacts/before_surecler.txt)"
          curl -fsS "${BASE}?token=${TOKEN}&action=postcheck&before_personeller=${BEFORE_P}&before_gunluk_puantaj=${BEFORE_G}&before_users=${BEFORE_U}&before_surecler=${BEFORE_S}" | tee /tmp/phasec053-artifacts/postcheck.json
          python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/phasec053-artifacts/postcheck.json'))
          print(json.dumps(data, indent=2))
          if not data.get('ok'):
            sys.exit(1)
          PY

      - name: Record already-effective skip
        if: github.event.inputs.confirm == 'MIGRATE_PHASEC053' && steps.preflight.outputs.already_effective == '1'
        run: |
          set -euo pipefail
          echo '{"ok":true,"code":"PHASEC053_ALREADY_EFFECTIVE","skipped_apply":true}' | tee /tmp/phasec053-artifacts/migrate.json
          cp /tmp/phasec053-artifacts/preflight.json /tmp/phasec053-artifacts/postcheck.json

      - name: Delete ops files via FTP
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cleanup() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit false;
              set net:max-retries 3;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd api/public;
              rm -f _phasec053_migrate.php;
              rm -f 053_retention_legal_hold_arsiv.sql;
              rm -f phasec053_latest_backup_path.txt;
              bye
            "
          }
          if [ "${{ github.event.inputs.confirm }}" != "" ]; then
            cleanup true || cleanup false
          fi
          for mode in true false; do
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit false;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${mode};
              set ftp:ssl-force ${mode};
              set ftp:ssl-protect-data ${mode};
              cd api/public;
              glob rm karmotor_medisa_pre_053_*.sql;
              bye
            " || true
          done
          code=$(curl -sS -o /tmp/gone.txt -w "%{http_code}" "https://www.karmotors.com.tr/personelmedisa/api/public/_phasec053_migrate.php" || true)
          echo "post-delete HTTP=$code"

      - name: Upload migrate artifacts
        if: always() && github.event.inputs.confirm != 'CLEANUP_PHASEC053'
        uses: actions/upload-artifact@v4
        with:
          name: phasec053-live-schema-migrate-${{ github.event.inputs.confirm }}
          path: /tmp/phasec053-artifacts
          if-no-files-found: warn
