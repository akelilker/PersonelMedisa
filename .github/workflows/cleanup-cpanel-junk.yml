name: Cleanup cPanel junk

# Ops: delete stale deploy leftovers on cPanel FTP root (workflow_dispatch only).
# Preserves config.local.php, active SPA keep-set, and runtime PHP sources.

on:
  workflow_dispatch:

concurrency:
  group: cleanup-cpanel-junk
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale assets and bak/tmp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test -n "$FTP_PORT" || (echo "FTP_PORT secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP cleanup." && exit 1)

      - name: Install lftp and resolve live keep-set
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp
          BASE="https://www.karmotors.com.tr/personelmedisa"
          HTML=$(curl -fsSL "$BASE/index.html")
          JS_PATH=$(printf '%s' "$HTML" | grep -oE 'assets/index-[^"[:space:]]+\.js' | head -n1)
          CSS_PATH=$(printf '%s' "$HTML" | grep -oE 'assets/index-[^"[:space:]]+\.css' | head -n1)
          test -n "$JS_PATH" || (echo "Could not parse JS asset from live index.html" && exit 1)
          test -n "$CSS_PATH" || (echo "Could not parse CSS asset from live index.html" && exit 1)
          JS_BODY=$(curl -fsSL "$BASE/$JS_PATH")
          {
            echo "${JS_PATH#assets/}"
            echo "${CSS_PATH#assets/}"
            printf '%s' "$JS_BODY" | grep -oE 'logo-[A-Za-z0-9_.-]+\.svg' | sort -u
          } > /tmp/keep-assets.txt
          echo "Keep assets:"
          cat /tmp/keep-assets.txt

      - name: Delete junk via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          write_pass1() {
            local use_ftps="$1"
            cat > /tmp/cleanup-pass1.lftp <<EOF
          set cmd:fail-exit false
          set cmd:verbose on
          set net:max-retries 2
          set net:timeout 20
          set ftp:passive-mode on
          set ftp:ssl-allow ${use_ftps}
          set ftp:ssl-force ${use_ftps}
          set ftp:ssl-protect-data ${use_ftps}
          set ssl:verify-certificate no
          set ssl:check-hostname no
          cd .
          rm api/src/Router.php.pr120-pre.bak
          rm api/src/Router.php.pr120.tmp
          rm api/src/Router.php.s36c-before
          rm api/src/Controllers/PuantajController.php.s36c-before
          rm api/src/Controllers/ReferansController.php.pr120-pre.bak
          rm api/src/Controllers/ReferansController.php.pr120.tmp
          rm api/src/Controllers/ReferansController.php.pr120probe
          rm api/public/error_log
          rm api/public/_s77d_migrate.php
          rm api/README.md
          rm api/.env.example
          rmdir api/migrations
          rmdir api/seeds
          cls -1 assets/ > /tmp/remote-assets.txt
          bye
          EOF
            # Strip YAML/script leading indentation from heredoc body
            sed -i 's/^[[:space:]]*//' /tmp/cleanup-pass1.lftp
          }

          write_pass2() {
            local use_ftps="$1"
            {
              echo "set cmd:fail-exit false"
              echo "set cmd:verbose on"
              echo "set net:max-retries 2"
              echo "set net:timeout 20"
              echo "set ftp:passive-mode on"
              echo "set ftp:ssl-allow ${use_ftps}"
              echo "set ftp:ssl-force ${use_ftps}"
              echo "set ftp:ssl-protect-data ${use_ftps}"
              echo "set ssl:verify-certificate no"
              echo "set ssl:check-hostname no"
              echo "cd ."
              while IFS= read -r f || [[ -n "$f" ]]; do
                f="${f%$'\r'}"
                f="${f%/}"
                base=$(basename "$f")
                [[ -z "$base" || "$base" == "." || "$base" == ".." ]] && continue
                if grep -Fxq "$base" /tmp/keep-assets.txt; then
                  echo "!echo KEEP $base"
                else
                  echo "rm assets/$base"
                  echo "!echo DELETED $base"
                fi
              done < /tmp/remote-assets.txt
              echo "bye"
            } > /tmp/cleanup-pass2.lftp
          }

          run_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            echo "Cleanup modu: ${mode_name}"
            write_pass1 "$use_ftps"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -f /tmp/cleanup-pass1.lftp
            test -s /tmp/remote-assets.txt || (echo "assets listing missing/empty" && return 1)
            echo "Remote assets before prune:"
            cat /tmp/remote-assets.txt
            write_pass2 "$use_ftps"
            echo "Pass2 plan:"
            grep -E '^(rm |!echo)' /tmp/cleanup-pass2.lftp || true
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -f /tmp/cleanup-pass2.lftp
          }

          echo "Explicit FTPS port 21 deneniyor..."
          if run_mode "explicit-ftps" "true"; then
            exit 0
          fi
          echo "Explicit FTPS basarisiz, plain FTP fallback..."
          run_mode "plain-ftp" "false"

      - name: Post-cleanup smoke
        run: |
          set -euo pipefail
          BASE="https://www.karmotors.com.tr/personelmedisa"
          curl -fsS -o /tmp/live-index.html "$BASE/"
          JS=$(grep -oE 'assets/index-[^"[:space:]]+\.js' /tmp/live-index.html | head -n1)
          CSS=$(grep -oE 'assets/index-[^"[:space:]]+\.css' /tmp/live-index.html | head -n1)
          test -n "$JS" && test -n "$CSS"
          curl -fsSI "$BASE/$JS" | head -n1
          curl -fsSI "$BASE/$CSS" | head -n1
          for logo in logo-footer-DYmTbD-M.svg logo-header2-B8abgayK.svg logo-header2-mobile-header-BcZHnz2S.svg; do
            curl -fsSI "$BASE/assets/$logo" | head -n1
          done
          curl -fsS "$BASE/api/health" | grep -q '"status":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/personeller")
          test "$code" = "401"
          echo "Anonymous smoke OK"
