name: S87 Apply Critical Owner Patch

on:
  push:
    branches:
      - fix/s87-critical-owner-gaps-reopen
    paths:
      - ops/.s87-critical-owner-gaps.patch.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/s87-critical-owner-gaps-reopen
          fetch-depth: 0

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "3707292d08c4c549b6c0198111240248e6560e74"
          echo "cd7ed439fb7ddf41b4323e52f948321be7ccf12fe219abd939c2bbc2147cf0ea  ops/.s87-critical-owner-gaps.patch.gz" | sha256sum -c -
          gzip -dc ops/.s87-critical-owner-gaps.patch.gz > /tmp/s87-critical-owner-gaps.patch
          echo "aad82a85a4d8a53fcd762d2aee375c843da8355e0670917d98b4d05032b177ae  /tmp/s87-critical-owner-gaps.patch" | sha256sum -c -
          git apply --check /tmp/s87-critical-owner-gaps.patch
          git apply /tmp/s87-critical-owner-gaps.patch
          rm ops/.s87-critical-owner-gaps.patch.gz
          git diff --check

          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/s87-apply-critical-owner-gaps.yml
          api/src/Controllers/BildirimPuantajEtkiAdaylariController.php
          api/src/Controllers/FazlaCalismaOdemeTercihiController.php
          api/src/Controllers/PuantajController.php
          api/src/Services/BildirimPuantajEtkiProjectionService.php
          api/src/Services/MaasHesaplamaAdayService.php
          api/src/Services/MaasHesaplamaSnapshotService.php
          api/src/Services/Payroll/MaasHesaplamaEngine.php
          api/src/Services/Payroll/PayrollComplianceGuard.php
          src/services/puantaj-hesap-motoru.ts
          tests/php/BildirimPuantajEtkiProjectionTestRunner.php
          tests/php/FazlaCalismaOdemeTercihiMysqlTestRunner.php
          tests/php/MaasHesaplamaEngineTestRunner.php
          tests/php/MaasHesaplamaSnapshotTestRunner.php
          tests/php/PayrollComplianceGuardTestRunner.php
          tests/php/PuantajControllerGecErkenDakikaTestRunner.php
          tests/unit/bildirim-puantaj-etki-projection.php-runtime.test.ts
          tests/unit/fazla-calisma-odeme-tercihi-mysql.php-runtime.test.ts
          tests/unit/payroll-compliance-guard.source.test.ts
          tests/unit/puantaj-controller-gec-erken-dakika.php-runtime.test.ts
          tests/unit/puantaj-hesap-motoru.test.ts
          EOF
          git diff --name-only HEAD~2 | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit applied owner fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: s87 kritik owner bosluklarini kapat"
          git push origin HEAD:fix/s87-critical-owner-gaps-reopen
