name: Deploy cPanel

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: 24
      LOCAL_DIST_DIR: ./dist/
      LOCAL_REPO_DIR: ${{ github.workspace }}
      REMOTE_TARGET_DIR: .
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout tested commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout manual dispatch ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_APP_BASE_PATH: /personelmedisa/
          VITE_API_MODE: real
          VITE_DEMO_API_FALLBACK: "false"
          VITE_ENABLE_DIAGNOSTICS: "false"
        run: npm run build

      - name: Validate SPA rewrite file
        run: |
          test -f dist/.htaccess || (echo "dist/.htaccess missing. SPA routes will 404." && exit 1)

      - name: Validate PHP API deploy files
        run: |
          test -f api/.htaccess || (echo "api/.htaccess missing." && exit 1)
          test -f api/public/index.php || (echo "api/public/index.php missing." && exit 1)
          test -f api/src/Router.php || (echo "api/src/Router.php missing." && exit 1)
          test -f api/src/Database/MigrationRunner.php || (echo "MigrationRunner missing." && exit 1)
          test -f api/src/Database/migration_ledger.sql || (echo "Migration ledger bootstrap missing." && exit 1)
          test -f api/migrations/067_personel_canonical_reference_gate.sql || (echo "Migration 067 missing." && exit 1)
          test -f api/migrations/068_sgk_actor_identity_lifecycle_audit.sql || (echo "Migration 068 missing." && exit 1)
          test -f api/bin/migrate.php || (echo "CLI migration runner missing." && exit 1)
          test -f api/bin/cpanel-migration-cron.php || (echo "Cron migration worker missing." && exit 1)
          test -f api/runtime/.htaccess || (echo "Protected runtime deny file missing." && exit 1)
          test ! -f api/config.local.php || (echo "api/config.local.php must not be committed or deployed from repo." && exit 1)

      - name: Generate canonical migration bundle
        run: npm run generate:migration-bundle

      - name: Validate canonical migration bundle
        run: |
          test -s api/runtime-build/canonical-migrations.php || (echo "Canonical migration bundle missing." && exit 1)
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const bundle = readFileSync('api/runtime-build/canonical-migrations.php', 'utf8'); for (const marker of [\"'version' => '000'\", \"'name' => '067_personel_canonical_reference_gate.sql'\", \"'name' => '068_sgk_actor_identity_lifecycle_audit.sql'\"]) { if (!bundle.includes(marker)) throw new Error('Canonical migration bundle marker missing: ' + marker); }"

      - name: Validate deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test -n "$FTP_PORT" || (echo "FTP_PORT secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)
          test -n "$SMOKE_AUTH_USERNAME" || (echo "SMOKE_AUTH_USERNAME secret is missing." && exit 1)
          test -n "$SMOKE_AUTH_PASSWORD" || (echo "SMOKE_AUTH_PASSWORD secret is missing." && exit 1)

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Local lftp directory preflight
        env:
          LOCAL_DIST_DIR: ${{ env.LOCAL_DIST_DIR }}
          LOCAL_REPO_DIR: ${{ env.LOCAL_REPO_DIR }}
        run: |
          set -euo pipefail

          DIST_ABS="$(realpath "${LOCAL_DIST_DIR%/}")"
          REPO_ABS="$(realpath "$LOCAL_REPO_DIR")"

          test -d "$DIST_ABS"
          test -d "$REPO_ABS"
          test -f "$DIST_ABS/index.html"

          DIST_LCD="$(node --input-type=module -e "import { renderLftpLocalDir } from './scripts/deploy/plan-cpanel-incremental.mjs'; process.stdout.write(renderLftpLocalDir(process.argv[1]));" "$DIST_ABS")"
          REPO_LCD="$(node --input-type=module -e "import { renderLftpLocalDir } from './scripts/deploy/plan-cpanel-incremental.mjs'; process.stdout.write(renderLftpLocalDir(process.argv[1]));" "$REPO_ABS")"

          echo "LOCAL_DIST_ABS=${DIST_ABS}"
          echo "LOCAL_REPO_ABS=${REPO_ABS}"
          echo "LOCAL_DIST_LCD=${DIST_LCD}"
          echo "LOCAL_REPO_LCD=${REPO_LCD}"

          # No FTP credentials: proves lftp local-directory parser accepts rendered lcd paths.
          lftp -e "
            set cmd:fail-exit true;
            lcd ${DIST_LCD};
            lpwd;
            lcd ${REPO_LCD};
            lpwd;
            bye
          "
          echo "LOCAL_LFTP_PREFLIGHT=PASS"

      - name: Upload dist and PHP API to cPanel personelmedisa FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          LOCAL_DIST_DIR: ${{ env.LOCAL_DIST_DIR }}
          LOCAL_REPO_DIR: ${{ env.LOCAL_REPO_DIR }}
          REMOTE_TARGET_DIR: ${{ env.REMOTE_TARGET_DIR }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail

          PLAN_DIR="$RUNNER_TEMP/cpanel-deploy-plan"
          mkdir -p "$PLAN_DIR"
          DEPLOY_SHA_LOCAL="$PLAN_DIR/.deploy-sha"
          printf '%s\n' "$DEPLOY_SHA" > "$DEPLOY_SHA_LOCAL"

          deploy_with_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Deploy transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"
            echo "Explicit FTPS port 21 deneniyor..."
            if deploy_with_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi
            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            deploy_with_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          PREVIOUS_DEPLOY_SHA="NONE"
          PREVIOUS_SHA_READ="NOT_FOUND"
          previous_sha_file="$PLAN_DIR/previous.deploy-sha"
          previous_sha_log="$PLAN_DIR/previous-sha-read.log"
          rm -f "$previous_sha_file" "$previous_sha_log"

          set +e
          run_cpanel_ftp "cd ${REMOTE_TARGET_DIR}; get -o ${previous_sha_file} api/.deploy-sha;" >"$previous_sha_log" 2>&1
          previous_sha_rc=$?
          set -e

          if [[ "$previous_sha_rc" -ne 0 ]]; then
            # Privacy-safe classification only — never echo FTP credentials or raw auth lines.
            if grep -qiE '550|No such file|not found|does not exist|File not found' "$previous_sha_log"; then
              PREVIOUS_SHA_READ="NOT_FOUND"
            else
              PREVIOUS_SHA_READ="TRANSPORT_FAILED"
            fi
            PREVIOUS_DEPLOY_SHA="NONE"
          elif [[ ! -s "$previous_sha_file" ]]; then
            PREVIOUS_SHA_READ="NOT_FOUND"
            PREVIOUS_DEPLOY_SHA="NONE"
          else
            PREVIOUS_DEPLOY_SHA="$(tr -d '\r\n' < "$previous_sha_file" || true)"
            if [[ "$PREVIOUS_DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              PREVIOUS_SHA_READ="SUCCESS"
            else
              PREVIOUS_SHA_READ="INVALID_CONTENT"
              PREVIOUS_DEPLOY_SHA="NONE"
            fi
          fi

          echo "PREVIOUS_SHA_READ=${PREVIOUS_SHA_READ}"
          if [[ "$PREVIOUS_SHA_READ" == "SUCCESS" ]]; then
            echo "PREVIOUS_SHA_VALUE=${PREVIOUS_DEPLOY_SHA}"
          fi

          node scripts/deploy/plan-cpanel-incremental.mjs \
            --previous-sha="$PREVIOUS_DEPLOY_SHA" \
            --current-sha="$DEPLOY_SHA" \
            --repo-root="$LOCAL_REPO_DIR" \
            --dist-dir="${LOCAL_DIST_DIR%/}" \
            --out-dir="$PLAN_DIR" \
            --deploy-sha-local-path="$DEPLOY_SHA_LOCAL" \
            --remote-target-dir="$REMOTE_TARGET_DIR"

          # shellcheck disable=SC1091
          set -a
          # summary.env is KEY=VALUE lines without secrets
          source "$PLAN_DIR/summary.env"
          set +a

          echo "DEPLOY_MODE=${DEPLOY_MODE}"
          echo "PREVIOUS_DEPLOY_SHA=${PREVIOUS_DEPLOY_SHA}"
          echo "PREVIOUS_SHA_READ=${PREVIOUS_SHA_READ}"
          echo "CURRENT_DEPLOY_SHA=${CURRENT_DEPLOY_SHA}"
          echo "API_CHANGED_FILES=${API_CHANGED_FILES}"
          echo "API_UPLOADED_FILES=${API_UPLOADED_FILES}"
          echo "API_DELETED_FILES=${API_DELETED_FILES}"
          echo "UNCHANGED_API_FILES_SKIPPED=${UNCHANGED_API_FILES_SKIPPED}"
          echo "FRONTEND_DEPLOY_MODE=${FRONTEND_DEPLOY_MODE}"
          echo "FRONTEND_FILES_UPLOADED=${FRONTEND_FILES_UPLOADED}"
          echo "FALLBACK_REASON=${FALLBACK_REASON}"

          ACTIVE_COMMANDS="$(cat "$PLAN_DIR/ftp-active.commands")"
          FULL_COMMANDS="$(cat "$PLAN_DIR/ftp-full.commands")"
          FINALIZE_SHA_COMMANDS="$(cat "$PLAN_DIR/ftp-finalize-sha.commands")"

          # Keep full-mirror command strings discoverable for safety/source contracts:
          # mirror -R --verbose api/public api/public
          # mirror -R --verbose api/src api/src
          # mirror -R --verbose api/bin api/bin
          # mirror -R --verbose api/migrations api/migrations
          # mirror -R --verbose api/runtime-build api/runtime-build
          # Payload transfer NEVER writes api/.deploy-sha.
          # Finalization is a separate FTP operation after payload verify PASS.

          verify_payload_before_sha() {
            local remote_bundle_path
            remote_bundle_path="$(mktemp)"
            run_cpanel_ftp "
              cd ${REMOTE_TARGET_DIR};
              get -o ${remote_bundle_path} api/runtime-build/canonical-migrations.php;
            "
            test "$(sha256sum "${remote_bundle_path}" | cut -d' ' -f1)" = \
              "$(sha256sum "${LOCAL_REPO_DIR}/api/runtime-build/canonical-migrations.php" | cut -d' ' -f1)"
            rm -f "${remote_bundle_path}"
          }

          finalize_deploy_sha() {
            echo "Deploy SHA finalization starting (marker write after payload verify)"
            run_cpanel_ftp "$FINALIZE_SHA_COMMANDS"
            local remote_sha_path
            remote_sha_path="$(mktemp)"
            run_cpanel_ftp "
              cd ${REMOTE_TARGET_DIR};
              get -o ${remote_sha_path} api/.deploy-sha;
            "
            test "$(tr -d '\r\n' < "${remote_sha_path}")" = "${DEPLOY_SHA}"
            rm -f "${remote_sha_path}"
            echo "Deploy SHA finalization verified"
          }

          upload_verify_finalize() {
            local label="$1"
            local commands="$2"
            echo "Deploy payload transfer path: ${label}"
            run_cpanel_ftp "$commands"
            echo "Deploy payload pre-finalization verify: ${label}"
            verify_payload_before_sha
            finalize_deploy_sha
          }

          if [[ "$DEPLOY_MODE" == "INCREMENTAL" ]]; then
            if ! upload_verify_finalize "INCREMENTAL" "$ACTIVE_COMMANDS"; then
              echo "INCREMENTAL transfer/verify/finalize failed; switching to FULL_MIRROR_FALLBACK"
              echo "FALLBACK_REASON=INCREMENTAL_TRANSFER_OR_VERIFY_FAILED"
              # On incremental failure the production marker must remain the previous SHA
              # until fallback payload verify PASS and a successful finalize.
              upload_verify_finalize "FULL_MIRROR_FALLBACK" "$FULL_COMMANDS"
            fi
          else
            upload_verify_finalize "FULL_MIRROR_FALLBACK" "$FULL_COMMANDS"
          fi

      - name: Verify deployed app with anonymous and authenticated read-only smoke
        env:
          SMOKE_BASE_URL: https://www.karmotors.com.tr
          SMOKE_APP_PREFIX: /personelmedisa
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: npm run smoke:live
