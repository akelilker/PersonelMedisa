name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  apply-s87-query-stage-diagnostic:
    name: Apply S87 query-stage diagnostic
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/s87-critical-owner-gaps-reopen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and apply exact diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ed47d3a3cd0f78e14c9d399c5eef6c62ac5da415"
          echo "edd0427f54bb567286d51a4af3362794afe760678a11da62bf9e477241f44ae1  ops/.s87-diagnostic.patch.gz" | sha256sum -c -
          gzip -dc ops/.s87-diagnostic.patch.gz > /tmp/s87-diagnostic.patch
          echo "c875e0b6259315f44dba57499d8376da492c47e40c86e1b54c4381c11d07e0be  /tmp/s87-diagnostic.patch" | sha256sum -c -
          git apply --check /tmp/s87-diagnostic.patch
          git apply /tmp/s87-diagnostic.patch
          rm ops/.s87-diagnostic.patch.gz
          git checkout 79b381fd38b6e09b0fc523d0942227292cb6bbed -- .github/workflows/ci.yml
          git diff --check

          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/ci.yml
          api/src/Services/Payroll/PayrollComplianceGuard.php
          ops/.s87-diagnostic.patch.gz
          tests/php/MaasHesaplamaSnapshotMysqlConcurrencyTestRunner.php
          EOF
          git diff --name-only HEAD | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: identify S87 compliance query failure stage"
          git push origin HEAD:fix/s87-critical-owner-gaps-reopen

  quality:
    name: Unit + Typecheck + Build
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: medisa_ci_root_pw
          MARIADB_DATABASE: medisa_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      MEDISA_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=medisa_ci;charset=utf8mb4"
      MEDISA_TEST_MYSQL_USER: root
      MEDISA_TEST_MYSQL_PASSWORD: medisa_ci_root_pw

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mysqli
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Wait for MariaDB and print version
        run: |
          php -r '
            $dsn = getenv("MEDISA_TEST_MYSQL_DSN");
            $user = getenv("MEDISA_TEST_MYSQL_USER");
            $pass = getenv("MEDISA_TEST_MYSQL_PASSWORD");
            $lastError = "";
            for ($i = 0; $i < 30; $i++) {
              try {
                $pdo = new PDO($dsn, $user, $pass, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                $version = $pdo->query("SELECT VERSION()")->fetchColumn();
                $one = $pdo->query("SELECT 1")->fetchColumn();
                echo "MariaDB ready: version=" . $version . " select1=" . $one . PHP_EOL;
                exit(0);
              } catch (Throwable $e) {
                $lastError = $e->getMessage();
                sleep(2);
              }
            }
            fwrite(STDERR, "MariaDB readiness failed: " . $lastError . PHP_EOL);
            exit(1);
          '

      - name: Run API parity gate
        run: npm run check:api-parity

      - name: Run type check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test

      - name: Prove S83 MariaDB carryover import acceptance
        run: |
          set -euo pipefail
          OUT="$(php tests/php/S83BordroDevirImportMysqlTestRunner.php)"
          echo "$OUT"
          echo "$OUT" | grep -F "verify-s83-devir-import-mysql: OK"
          echo "$OUT" | grep -F "[PASS] dry_run: eklenecek for valid sicil"
          echo "$OUT" | grep -F "[PASS] commit dry_run=false with all-valid rows inserts AKTIF row"
          echo "$OUT" | grep -F "[PASS] commit with any invalid row throws DEVIR_IMPORT_VALIDATION_FAILED"

      - name: Run build
        run: npm run build

  s80-e2e:
    name: S80 Revizyon Merkezi E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run S80 Revizyon Merkezi Playwright
        run: npm run e2e:s80

  s81-e2e:
    name: S81 Bildirim ve Onay Zinciri E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run S81 Bildirim ve Onay Zinciri Playwright
        run: npm run e2e:s81

  s82-e2e:
    name: S82 Bordro Hazirlik Merkezi E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run S82 Bordro Hazirlik Merkezi Playwright
        run: npm run e2e:s82

  s83-e2e:
    name: S83 Business Data Readiness E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run S83 Business Data Readiness Playwright
        run: npm run e2e:s83

  s84-e2e:
    name: S84-R2 Payroll Scope E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run S84-R2 Payroll Scope Playwright
        run: npm run e2e:s84r2
