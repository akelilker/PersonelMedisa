name: PhaseC 053 Residual Recovery

# TEMPORARY OPS ONLY — workflow_dispatch. Never merge product PR from here.
# Triggered only manually. Temporary main commit must use [skip ci].

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "BACKUP_PARTIAL | APPLY_RESIDUAL | VERIFY_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phasec-053-residual-recovery
  cancel-in-progress: false

jobs:
  residual:
    name: PhaseC 053 residual recovery via temporary FTP ops
    if: >-
      github.event.inputs.mode == 'BACKUP_PARTIAL' ||
      github.event.inputs.mode == 'APPLY_RESIDUAL' ||
      github.event.inputs.mode == 'VERIFY_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHORIZED_HEAD: 82f37612cbb28fbe3adf221a786ef4218e6c1b29
      EXPECTED_053_SHA: 5969a777ffd9d59f315139c57b86ee76402084943ce97f26a97f11521947d1af
      EXPECTED_PLAN_SHA: c6d7c715382385c03f4b91f3f326fbe1ac19e40295eba527cf971d745d48e052
      HELPER_REMOTE: api/public/_phasec053_residual.php
      ASSETS_REMOTE: api/public/phasec-053-residual-assets.json
      BASE_URL: https://www.karmotors.com.tr/personelmedisa/api/public/_phasec053_residual.php
    steps:
      - name: Checkout temp main tooling
        uses: actions/checkout@v6

      - name: Validate tooling + authorized hashes
        run: |
          set -euo pipefail
          mkdir -p /tmp/phasec053-residual /tmp/phasec053-artifacts
          test -f scripts/phasec-053-residual-recover.php
          test -f scripts/phasec-053-residual-assets.json
          ASSETS_SHA=$(python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('scripts/phasec-053-residual-assets.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print(data['sha'])
          PY
          )
          test "$ASSETS_SHA" = "$EXPECTED_053_SHA"
          git fetch --no-tags origin "${AUTHORIZED_HEAD}"
          git show "${AUTHORIZED_HEAD}:api/migrations/053_retention_legal_hold_arsiv.sql" > /tmp/phasec053-residual/053_authorized.sql
          echo "${EXPECTED_053_SHA}  /tmp/phasec053-residual/053_authorized.sql" | sha256sum -c -
          echo "plan_sha_expected=${EXPECTED_PLAN_SHA}" | tee /tmp/phasec053-artifacts/plan-sha.txt

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD missing" && exit 1)
          test "${FTP_PORT}" = "21" || (echo "FTP_PORT must be 21" && exit 1)

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare one-shot residual payload
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          export TOKEN
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path('scripts/phasec-053-residual-recover.php').read_text(encoding='utf-8')
          token = os.environ['TOKEN']
          if src.count('REPLACE_PHASEC053_RESIDUAL_TOKEN') != 1:
              raise SystemExit(f"expected exactly 1 REPLACE placeholder, got {src.count('REPLACE_PHASEC053_RESIDUAL_TOKEN')}")
          out = src.replace('REPLACE_PHASEC053_RESIDUAL_TOKEN', token, 1)
          Path('/tmp/phasec053-residual/_phasec053_residual.php').write_text(out, encoding='utf-8', newline='\n')
          assets = Path('scripts/phasec-053-residual-assets.json').read_bytes()
          Path('/tmp/phasec053-residual/phasec-053-residual-assets.json').write_bytes(assets)
          print('token_injected_ok')
          PY
          if head -c 3 /tmp/phasec053-residual/_phasec053_residual.php | grep -q $'\xEF\xBB\xBF'; then
            echo "BOM detected" && exit 1
          fi
          grep -q "UNSET_PHASEC053_RESIDUAL_TOKEN" /tmp/phasec053-residual/_phasec053_residual.php
          grep -q "$TOKEN" /tmp/phasec053-residual/_phasec053_residual.php
          ls -la /tmp/phasec053-residual

      - name: Upload residual helper via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          upload() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 5;
              set net:timeout 30;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd .;
              mkdir -p api/public;
              lcd /tmp/phasec053-residual;
              put -O api/public _phasec053_residual.php;
              put -O api/public phasec-053-residual-assets.json;
              bye
            "
          }
          upload true || upload false

      - name: Identity + preflight
        id: preflight
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          call() {
            local action="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" "${BASE_URL}?token=${TOKEN}&action=${action}" || true)
            echo "http_${action}=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt
            echo "$code" > "/tmp/phasec053-artifacts/http_${action}.code"
            python3 - <<PY
          import json,sys
          path="$out"
          code=open("/tmp/phasec053-artifacts/http_${action}.code").read().strip()
          body=open(path,encoding="utf-8",errors="replace").read()
          print(body[:4000])
          try:
            data=json.loads(body)
          except Exception as e:
            print("NON_JSON_BODY", e)
            sys.exit(2)
          open(path,"w",encoding="utf-8").write(json.dumps(data,indent=2,ensure_ascii=False))
          if code not in ("200","409") and int(code) >= 400:
            # still keep body; fail after archive for hard errors except expected 409
            pass
          if not data.get("ok"):
            sys.exit(1)
          PY
          }
          call identity /tmp/phasec053-artifacts/identity.json
          call preflight /tmp/phasec053-artifacts/preflight.json
          python3 - <<'PY'
          import json,sys
          pre=json.load(open('/tmp/phasec053-artifacts/preflight.json',encoding='utf-8'))
          mode='''${{ github.event.inputs.mode }}'''
          idn=pre.get('identity') or {}
          if idn.get('aktif_veritabani') != 'karmotor_medisa':
            raise SystemExit('DB identity mismatch')
          bc=pre.get('business_counts') or {}
          if bc != {'personeller':4,'gunluk_puantaj':7,'users':8,'surecler':6}:
            raise SystemExit(f'unexpected business counts: {bc}')
          if not pre.get('role_enum_ok'):
            raise SystemExit('role enum verify failed')
          presence=pre.get('table_presence') or {}
          if mode in ('BACKUP_PARTIAL','APPLY_RESIDUAL'):
            if pre.get('code') != 'PARTIAL_READY_FOR_RESIDUAL':
              raise SystemExit(f'expected PARTIAL_READY_FOR_RESIDUAL, got {pre.get("code")}')
            if presence.get('arsiv_manifestleri') is not True:
              raise SystemExit('arsiv_manifestleri missing')
            for t in ['legal_holdlar','legal_hold_auditleri','arsiv_erisim_auditleri','retention_imha_talepleri','retention_imha_auditleri']:
              if presence.get(t):
                raise SystemExit(f'expected missing table present: {t}')
            man=pre.get('manifest') or {}
            if man.get('rows') != 0 or not man.get('has_new_unique') or man.get('has_old_unique'):
              raise SystemExit(f'manifest gate fail: {man}')
            if man.get('new_unique_columns') != ['entity_type','record_id','record_category','source_version_identity']:
              raise SystemExit(f'unique cols mismatch: {man.get("new_unique_columns")}')
          elif mode == 'VERIFY_ONLY':
            if not pre.get('already_complete') and pre.get('code') != 'ALREADY_COMPLETE':
              # post residual preflight reports ALREADY_COMPLETE when all tables exist
              if presence and all(presence.get(t) for t in ['arsiv_manifestleri','legal_holdlar','legal_hold_auditleri','arsiv_erisim_auditleri','retention_imha_talepleri','retention_imha_auditleri']):
                pass
              else:
                raise SystemExit(f'VERIFY_ONLY expected complete schema, got {pre.get("code")} {presence}')
          print('preflight_gate_ok')
          PY

      - name: Backup partial state
        if: github.event.inputs.mode == 'BACKUP_PARTIAL'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/phasec053-artifacts/backup.json -w "%{http_code}" "${BASE_URL}?token=${TOKEN}&action=backup" || true)
          echo "http_backup=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt
          echo "$code" > /tmp/phasec053-artifacts/http_backup.code
          cat /tmp/phasec053-artifacts/backup.json
          python3 - <<'PY'
          import json,sys
          code=open('/tmp/phasec053-artifacts/http_backup.code').read().strip()
          data=json.load(open('/tmp/phasec053-artifacts/backup.json',encoding='utf-8'))
          if code != '200' or not data.get('ok'):
            raise SystemExit(f'backup failed http={code} body={data}')
          if int(data.get('backup_bytes') or 0) <= 0:
            raise SystemExit('backup bytes <= 0')
          open('/tmp/phasec053-artifacts/backup-meta.env','w').write(
            f"FNAME={data['backup_filename']}\nSHA={data['backup_sha256']}\nBYTES={data['backup_bytes']}\n"
          )
          PY
          # shellcheck disable=SC1091
          source /tmp/phasec053-artifacts/backup-meta.env
          code=$(curl -sS -o "/tmp/phasec053-artifacts/${FNAME}" -w "%{http_code}" "${BASE_URL}?token=${TOKEN}&action=download_backup&file=${FNAME}" || true)
          echo "http_download_backup=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt
          test "$code" = "200"
          test -s "/tmp/phasec053-artifacts/${FNAME}"
          echo "${SHA}  /tmp/phasec053-artifacts/${FNAME}" | sha256sum -c -
          ls -la "/tmp/phasec053-artifacts/${FNAME}"
          # fingerprint for Stage B drift check
          cp /tmp/phasec053-artifacts/preflight.json /tmp/phasec053-artifacts/stage_a_fingerprint.json

      - name: Apply residual DDL
        if: github.event.inputs.mode == 'APPLY_RESIDUAL'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/phasec053-artifacts/residual.json -w "%{http_code}" "${BASE_URL}?token=${TOKEN}&action=residual" || true)
          echo "http_residual=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt
          echo "$code" > /tmp/phasec053-artifacts/http_residual.code
          cat /tmp/phasec053-artifacts/residual.json
          python3 - <<'PY'
          import json,sys
          code=open('/tmp/phasec053-artifacts/http_residual.code').read().strip()
          raw=open('/tmp/phasec053-artifacts/residual.json',encoding='utf-8',errors='replace').read()
          try:
            data=json.loads(raw)
          except Exception as e:
            raise SystemExit(f'residual non-json http={code}: {e}: {raw[:2000]}')
          open('/tmp/phasec053-artifacts/residual.json','w',encoding='utf-8').write(json.dumps(data,indent=2,ensure_ascii=False))
          if code != '200' or not data.get('ok'):
            raise SystemExit(f'residual failed http={code} code={data.get("code")} failed={data.get("failed")}')
          applied=int(data.get('applied') or 0)
          # Expect 13 applied when all CREATE+FK were missing; tolerate already-effective skips only if complete
          ops=data.get('ops') or []
          applied_ops=[o for o in ops if o.get('result')=='APPLIED']
          create_applied=len([o for o in applied_ops if o.get('operation')=='CREATE_TABLE'])
          fk_applied=len([o for o in applied_ops if o.get('operation')=='ADD_FK'])
          print('applied',applied,'create',create_applied,'fk',fk_applied,'ops',len(ops))
          if create_applied != 5:
            raise SystemExit(f'expected 5 CREATE applied, got {create_applied}')
          if fk_applied != 8:
            raise SystemExit(f'expected 8 FK applied, got {fk_applied}')
          if applied != 13:
            raise SystemExit(f'expected 13 applied statements, got {applied}')
          if not data.get('business_counts_unchanged') or not data.get('user_role_distribution_unchanged'):
            raise SystemExit('business invariance failed')
          if not data.get('new_tables_empty_ok'):
            raise SystemExit('non-zero phase c rows')
          if not data.get('destruction_snapshot_columns_ok') or not data.get('role_enum_ok'):
            raise SystemExit('schema postcheck flags failed')
          man=data.get('manifest') or {}
          if not man.get('has_new_unique') or man.get('has_old_unique'):
            raise SystemExit('manifest unique postcheck failed')
          print('residual_ok')
          PY

      - name: Verify only (postcheck)
        if: github.event.inputs.mode == 'VERIFY_ONLY' || github.event.inputs.mode == 'APPLY_RESIDUAL'
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/phasec053-artifacts/postcheck.json -w "%{http_code}" "${BASE_URL}?token=${TOKEN}&action=postcheck" || true)
          echo "http_postcheck=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt
          echo "$code" > /tmp/phasec053-artifacts/http_postcheck.code
          cat /tmp/phasec053-artifacts/postcheck.json
          python3 - <<'PY'
          import json,sys
          code=open('/tmp/phasec053-artifacts/http_postcheck.code').read().strip()
          data=json.load(open('/tmp/phasec053-artifacts/postcheck.json',encoding='utf-8'))
          if code != '200' or not data.get('ok'):
            raise SystemExit(f'postcheck failed http={code} data={data}')
          counts=data.get('new_table_counts') or {}
          for k,v in counts.items():
            if v != 0:
              raise SystemExit(f'non-zero rows {k}={v}')
          bc=data.get('business_counts') or {}
          if bc != {'personeller':4,'gunluk_puantaj':7,'users':8,'surecler':6}:
            raise SystemExit(f'business counts drift {bc}')
          man=data.get('manifest') or {}
          if not man.get('has_new_unique') or man.get('has_old_unique'):
            raise SystemExit('manifest unique fail')
          if not data.get('destruction_snapshot_columns_ok') or not data.get('role_enum_ok'):
            raise SystemExit('verify flags fail')
          print('verify_ok')
          PY

      - name: Delete residual ops files via FTP
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cleanup() {
            local use_ftps="$1"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit false;
              set net:max-retries 5;
              set net:timeout 30;
              set ssl:verify-certificate no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              cd .;
              rm -f api/public/_phasec053_residual.php;
              rm -f api/public/phasec-053-residual-assets.json;
              glob -a rm -f api/public/karmotor_medisa_partial_053_pre_residual_*.sql;
              cls -1 api/public > /tmp/phasec053-artifacts/ftp-public-listing.txt;
              bye
            "
          }
          cleanup true || cleanup false
          echo '--- ftp listing (api/public) ---'
          cat /tmp/phasec053-artifacts/ftp-public-listing.txt || true
          if grep -E '_phasec053_residual\.php|phasec-053-residual-assets\.json|karmotor_medisa_partial_053_pre_residual_' /tmp/phasec053-artifacts/ftp-public-listing.txt; then
            echo 'TEMP FILES STILL PRESENT ON SERVER' >&2
            exit 1
          fi
          echo 'TEMP_REMOTE_HELPER_FILE_EXISTS=NO' | tee /tmp/phasec053-artifacts/cleanup.txt
          echo 'TEMP_REMOTE_PAYLOAD_FILE_EXISTS=NO' | tee -a /tmp/phasec053-artifacts/cleanup.txt
          echo 'TEMP_REMOTE_BACKUP_FILE_EXISTS=NO' | tee -a /tmp/phasec053-artifacts/cleanup.txt
          # HTTP probe (supplementary only)
          code=$(curl -sS -o /tmp/phasec053-artifacts/gone.txt -w "%{http_code}" "${BASE_URL}" || true)
          echo "http_gone=${code}" | tee -a /tmp/phasec053-artifacts/http-status.txt

      - name: Upload residual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phasec053-residual-${{ github.event.inputs.mode }}
          path: /tmp/phasec053-artifacts
          if-no-files-found: warn
          retention-days: 30
