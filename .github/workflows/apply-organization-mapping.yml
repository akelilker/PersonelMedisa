name: Apply organization mapping (operations only)

# Production'daki ilk sirket/sube/SGK/lokasyon eslemesini uygulayan kontrollu
# operasyon. Genel bir "sube tasima" ozelligi DEGILDIR: yalniz migration 079'un
# NULL biraktigi iliskileri, onaylanmis bir mapping spec'e gore, bir kez doldurur.
#
# Iki mod:
#   ORGANIZATION_MAPPING_PREFLIGHT - salt-okunur kapi. Hicbir satir yazilmaz.
#   ORGANIZATION_MAPPING_APPLY     - preflight + ZORUNLU backup + tek transaction
#                                    apply + postcheck. Backup dogrulanmazsa apply
#                                    baslamaz.
#
# Spec production degerlerini repo icinde review edilmis bir dosyadan alir; bu
# workflow spec uretmez, tahmin etmez ve serbest SQL kabul etmez.
#
# Bu workflow calisamaz eger: kod deploy edilmemisse (deploy SHA pariteti),
# envanter artifact'i yayinlanmamissa veya spec'in pinledigi inventory checksum
# production'da dogrulanamiyorsa.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        required: true
        default: ORGANIZATION_MAPPING_PREFLIGHT
        type: choice
        options:
          - ORGANIZATION_MAPPING_PREFLIGHT
          - ORGANIZATION_MAPPING_APPLY
      confirmation:
        description: Type the selected mode again to authorize it
        required: true
        type: string
      deployed_sha:
        description: Exact deployed commit SHA (must equal the spec authorized_deploy_sha)
        required: true
        type: string
      spec_path:
        description: Repository path of the approved mapping spec JSON
        required: true
        type: string
      expected_inventory_checksum:
        description: SHA-256 the spec pins; must match the published inventory
        required: true
        type: string

concurrency:
  group: cpanel-canonical-migration-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  map:
    name: Controlled initial organization mapping
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      SPEC_PATH: ${{ inputs.spec_path }}
      EXPECTED_INVENTORY_CHECKSUM: ${{ inputs.expected_inventory_checksum }}
      POLL_ATTEMPTS: "121"
      POLL_INTERVAL_SECONDS: "10"
      TOTAL_POLL_WINDOW_SECONDS: "1200"
    steps:
      - name: Validate explicit request
        run: |
          set -euo pipefail
          case "$MODE" in
            ORGANIZATION_MAPPING_PREFLIGHT|ORGANIZATION_MAPPING_APPLY) ;;
            *) echo "MAPPING_REASON=UNSUPPORTED_MODE" && exit 1 ;;
          esac
          test "$CONFIRMATION" = "$MODE" || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=CONFIRMATION_MISMATCH"
            exit 1
          }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=DEPLOYED_SHA_INPUT_INVALID"
            exit 1
          }
          [[ "$EXPECTED_INVENTORY_CHECKSUM" =~ ^[0-9a-f]{64}$ ]] || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=INVENTORY_CHECKSUM_INPUT_INVALID"
            exit 1
          }
          # The spec is a reviewed file in this repository, never free text and
          # never a path that could escape it.
          [[ "$SPEC_PATH" =~ ^ops/organization-mapping/[A-Za-z0-9._-]+\.json$ ]] || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_PATH_NOT_ALLOWED"
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FTP client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Verify the approved mapping spec
        run: |
          set -euo pipefail
          test -f "$SPEC_PATH" || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_FILE_MISSING"
            exit 1
          }
          jq -e . "$SPEC_PATH" >/dev/null || {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_NOT_JSON"
            exit 1
          }
          spec_sha="$(jq -r '.metadata.authorized_deploy_sha // "NONE"' "$SPEC_PATH")"
          spec_inventory="$(jq -r '.metadata.inventory_checksum // "NONE"' "$SPEC_PATH")"
          spec_operation="$(jq -r '.metadata.operation_id // "NONE"' "$SPEC_PATH")"
          echo "MAPPING_OPERATION_ID=${spec_operation}"
          if [[ "${spec_sha,,}" != "${DEPLOYED_SHA,,}" ]]; then
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_DEPLOY_SHA_MISMATCH"
            exit 1
          fi
          if [[ "$spec_inventory" != "$EXPECTED_INVENTORY_CHECKSUM" ]]; then
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_INVENTORY_CHECKSUM_MISMATCH"
            exit 1
          fi
          # No spec may carry a personnel or user-scope instruction; those axes are
          # not this operation's to touch.
          if jq -e '.. | objects | keys[] | select(. == "personel_id" or . == "user_id" or . == "tam_ad" or . == "sirket_id")' "$SPEC_PATH" >/dev/null 2>&1; then
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_FORBIDDEN_FIELD"
            exit 1
          fi
          if jq -e '[.branch_mappings[]?.sube_id] | index(3)' "$SPEC_PATH" >/dev/null 2>&1; then
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=SPEC_FORBIDDEN_BRANCH_ID"
            exit 1
          fi
          echo "SPEC_VERIFIED=YES"

      - name: Run the controlled mapping operation
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Mapping transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi
            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          block() {
            echo "MAPPING_RESULT=BLOCKED"
            echo "MAPPING_REASON=$1"
            exit 1
          }

          WORK="$RUNNER_TEMP/organization-mapping"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # 1) The mapping may only run against the code it was authorized for.
          run_cpanel_ftp "get api/.deploy-sha -o ${WORK}/deploy-sha.txt;" >/dev/null 2>&1 \
            || block CONTROL_PLANE_UNREACHABLE
          remote_sha="$(tr -d '\r\n' < "${WORK}/deploy-sha.txt" 2>/dev/null || true)"
          [[ "${remote_sha,,}" == "${DEPLOYED_SHA,,}" ]] || block DEPLOY_SHA_MISMATCH

          # 2) Worker parity: the live worker must be the one that owns these modes.
          run_cpanel_ftp "get api/bin/cpanel-migration-cron.php -o ${WORK}/remote-worker.php;" >/dev/null 2>&1 \
            || block CONTROL_PLANE_UNREACHABLE
          local_sha256="$(sha256sum api/bin/cpanel-migration-cron.php | cut -d' ' -f1)"
          remote_sha256="$(sha256sum "${WORK}/remote-worker.php" | cut -d' ' -f1)"
          [[ "$local_sha256" == "$remote_sha256" ]] || block REMOTE_WORKER_PARITY_MISMATCH
          grep -q 'ORGANIZATION_MAPPING_BACKUP' "${WORK}/remote-worker.php" \
            || block WORKER_MAPPING_BACKUP_STAGE_MISSING

          # 3) Busy guard.
          listing="$WORK/control-listing.txt"
          run_cpanel_ftp "cls -1 api/runtime/migration-control > ${listing};" >/dev/null 2>&1 \
            || block CONTROL_PLANE_UNREACHABLE
          if grep -q 'request\.pending\.' "$listing"; then block MIGRATION_CONTROL_PLANE_BUSY; fi
          if grep -q 'request\.processing\.' "$listing"; then block STALE_PROCESSING_REQUEST; fi
          if grep -q '/status.json$' "$listing"; then
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${WORK}/status.json;" >/dev/null 2>&1; then
              if [[ "$(jq -r '.state // empty' "${WORK}/status.json" 2>/dev/null || true)" == "RUNNING" ]]; then
                block WORKER_BUSY
              fi
            fi
          fi

          # 4) The published inventory must be the exact one the spec pins. Without
          #    this the spec would describe a production state nobody verified.
          grep -q '/organization-inventory.json$' "$listing" || block INVENTORY_ARTIFACT_MISSING
          run_cpanel_ftp "get api/runtime/migration-control/organization-inventory.json -o ${WORK}/inventory.json;" >/dev/null 2>&1 \
            || block INVENTORY_REPORT_UNREADABLE
          live_inventory_checksum="$(jq -r '.inventory_checksum // "NONE"' "${WORK}/inventory.json")"
          [[ "$live_inventory_checksum" == "$EXPECTED_INVENTORY_CHECKSUM" ]] || block INVENTORY_CHECKSUM_MISMATCH
          [[ "$(jq -r '.result // "BLOCKED"' "${WORK}/inventory.json")" == "PASS" ]] || block INVENTORY_NOT_PASS
          [[ "$(jq -r '.deployed_sha // "NONE"' "${WORK}/inventory.json")" == "${DEPLOYED_SHA,,}" ]] || block INVENTORY_SHA_MISMATCH

          REQUEST_ID="orgmap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "MAPPING_REQUEST_ID=${REQUEST_ID}"
          request_dir="$WORK/request"
          mkdir -p "$request_dir"
          # The spec travels as structured JSON the worker re-validates against its
          # own allowlist. No SQL, no table name and no free-text field.
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mode "$MODE" \
            --slurpfile spec "$SPEC_PATH" \
            '{schema_version: 1, request_id: $request_id, deployed_sha: $deployed_sha, requested_at: $requested_at, mode: $mode, mapping_spec: $spec[0]}' \
            > "$request_dir/request.${REQUEST_ID}.tmp"

          run_cpanel_ftp "
            mkdir -p api/runtime/migration-control;
            lcd ${request_dir};
            put -O api/runtime/migration-control request.${REQUEST_ID}.tmp;
            mv api/runtime/migration-control/request.${REQUEST_ID}.tmp api/runtime/migration-control/request.pending.${REQUEST_ID}.json;
          "

          status_file="$WORK/poll-status.json"
          deadline="$(( $(date +%s) + TOTAL_POLL_WINDOW_SECONDS ))"
          worker_state="NONE"
          for _ in $(seq 1 "$POLL_ATTEMPTS"); do
            rm -f "$status_file"
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${status_file};" >/dev/null 2>&1; then
              if [[ "$(jq -r '.request_id // empty' "$status_file" 2>/dev/null || true)" == "$REQUEST_ID" ]]; then
                worker_state="$(jq -r '.state // "NONE"' "$status_file" 2>/dev/null || echo NONE)"
                if [[ "$worker_state" == "SUCCEEDED" || "$worker_state" == "FAILED" ]]; then
                  break
                fi
              fi
            fi
            if (( $(date +%s) >= deadline )); then
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          echo "MAPPING_WORKER_STATE=${worker_state}"

          mkdir -p "$GITHUB_WORKSPACE/mapping-artifact"
          for artifact in organization-mapping-preflight organization-mapping-postcheck; do
            if run_cpanel_ftp "get api/runtime/migration-control/${artifact}.json -o ${WORK}/${artifact}.json;" >/dev/null 2>&1; then
              cp "${WORK}/${artifact}.json" "$GITHUB_WORKSPACE/mapping-artifact/${artifact}.json"
            fi
          done

          emit_scalar() {
            local label="$1" file="$2" filter="$3" pattern="$4" value
            value="$(jq -r "${filter} // \"NONE\"" "$file" 2>/dev/null || echo NONE)"
            [[ "$value" =~ $pattern ]] || value="NONE"
            echo "${label}=${value}"
          }
          emit_list() {
            local label="$1" file="$2" filter="$3" value
            value="$(jq -r "[${filter}[]? | tostring] | join(\",\")" "$file" 2>/dev/null || echo "")"
            [[ "$value" =~ ^[A-Za-z0-9_,.-]{0,512}$ ]] || value="UNPRINTABLE"
            echo "${label}=${value:-NONE}"
          }

          if [[ -f "${WORK}/organization-mapping-preflight.json" ]]; then
            pf="${WORK}/organization-mapping-preflight.json"
            emit_scalar MAPPING_PREFLIGHT_RESULT "$pf" '.result' '^(PASS|BLOCKED)$'
            emit_scalar MAPPING_SPEC_CHECKSUM "$pf" '.spec_checksum' '^[0-9a-f]{64}$'
            emit_list MAPPING_PREFLIGHT_BLOCKERS "$pf" '.blockers'
            emit_list MAPPING_COMPANIES_TO_CREATE "$pf" '.planned_changes.companies_to_create'
            emit_list MAPPING_BRANCHES_TO_MAP "$pf" '.planned_changes.branches_to_map'
            emit_list MAPPING_APPROVED_RENAMES "$pf" '.planned_changes.approved_renames'
            emit_list MAPPING_SGK_TO_MAP "$pf" '.planned_changes.sgk_to_map'
            emit_list MAPPING_LOCATIONS_TO_MAP "$pf" '.planned_changes.locations_to_map'
            emit_list MAPPING_LOCATIONS_DEFERRED "$pf" '.planned_changes.locations_deferred'
          fi

          if [[ "$worker_state" == "FAILED" ]]; then
            reason="$(jq -r 'if (.reason | type) == "string" and (.reason | test("^[A-Z0-9_]+$")) then .reason else "UNKNOWN_MAPPING_FAILURE" end' "$status_file" 2>/dev/null || echo UNKNOWN_MAPPING_FAILURE)"
            block "$reason"
          fi
          if [[ "$worker_state" != "SUCCEEDED" ]]; then
            block WAITING_FOR_CRON_TICK
          fi

          if [[ "$MODE" == "ORGANIZATION_MAPPING_PREFLIGHT" ]]; then
            [[ -f "${WORK}/organization-mapping-preflight.json" ]] || block MAPPING_PREFLIGHT_REPORT_MISSING
            [[ "$(jq -r '.result // "BLOCKED"' "${WORK}/organization-mapping-preflight.json")" == "PASS" ]] \
              || block MAPPING_PREFLIGHT_NOT_PASS
            echo "MAPPING_RESULT=PREFLIGHT_PASS"
            echo "MAPPING_APPLY_READY=YES"
            echo "PRODUCTION_MUTATION_COUNT=0"
            exit 0
          fi

          # Apply: the backup evidence and the postcheck are both mandatory.
          for field in backup_file backup_sha256 backup_readback; do
            value="$(jq -r ".${field} // \"NONE\"" "$status_file")"
            [[ "$value" != "NONE" ]] || block MAPPING_BACKUP_EVIDENCE_MISSING
          done
          [[ "$(jq -r '.backup_readback' "$status_file")" == "VERIFIED" ]] || block MAPPING_BACKUP_NOT_VERIFIED
          emit_scalar MAPPING_BACKUP_FILE "$status_file" '.backup_file' '^[A-Za-z0-9._-]{1,160}$'
          emit_scalar MAPPING_BACKUP_SHA256 "$status_file" '.backup_sha256' '^[0-9a-f]{64}$'
          emit_scalar MAPPING_BACKUP_BYTES "$status_file" '.backup_bytes' '^[0-9]{1,12}$'
          echo "MAPPING_BACKUP_READBACK=VERIFIED"

          [[ -f "${WORK}/organization-mapping-postcheck.json" ]] || block MAPPING_POSTCHECK_REPORT_MISSING
          pc="${WORK}/organization-mapping-postcheck.json"
          emit_scalar MAPPING_POSTCHECK_RESULT "$pc" '.result' '^(PASS|BLOCKED)$'
          emit_scalar MAPPING_COMPANY_ROWS "$pc" '.company_rows' '^-?[0-9]{1,12}$'
          emit_scalar MAPPING_SCHEMA_READY "$pc" '.readiness.schema_ready' '^(true|false)$'
          emit_scalar MAPPING_DATA_READY "$pc" '.readiness.data_ready' '^(true|false)$'
          emit_scalar MAPPING_READINESS_BLOCKER_COUNT "$pc" '.readiness.blocker_count' '^[0-9]{1,6}$'
          emit_scalar MAPPING_SGK_MISMATCH_COUNT "$pc" '.readiness.sube_sgk_sirket_mismatch_count' '^-?[0-9]{1,12}$'
          emit_list MAPPING_UNEXPECTED_DELTAS "$pc" '.unexpected_deltas'
          for table in sirketler subeler sgk_isverenler calisma_lokasyonlari personeller user_subeler user_sirketler user_sgk_isverenler; do
            emit_scalar "MAPPING_ROWS_$(echo "$table" | tr '[:lower:]' '[:upper:]')" "$pc" ".row_counts.${table}" '^-?[0-9]{1,12}$'
          done
          [[ "$(jq -r '.result // "BLOCKED"' "$pc")" == "PASS" ]] || block MAPPING_POSTCHECK_NOT_PASS

          echo "MAPPING_RESULT=APPLIED"

      - name: Publish mapping evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-mapping-evidence
          path: mapping-artifact/
          retention-days: 14
          if-no-files-found: warn
