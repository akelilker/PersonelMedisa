name: Set cPanel standard initial password hash

# Narrow OPS owner: privacy-safe get → patch → put → readback for ONLY
# standard_initial_password_hash in production
# public_html/personelmedisa/api/config.local.php (FTP path: api/config.local.php).
#
# The value comes from the masked repository secret STANDARD_INITIAL_PASSWORD_HASH
# (a bcrypt hash, never a plaintext password) and is never echoed, never passed on a
# command line and never uploaded as an artifact. Output is status flags only.
# Reuses existing FTP_* secrets. No generic key/value/path inputs. No SSH.
# Rollback restores the runner-local backup.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET_STANDARD_INITIAL_PASSWORD_HASH to authorize this request
        required: true
        type: string

concurrency:
  group: cpanel-standard-initial-password-hash-ops
  cancel-in-progress: false

jobs:
  set-standard-initial-password-hash:
    name: Privacy-safe standard initial password hash set + readback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      STANDARD_INITIAL_PASSWORD_HASH: ${{ secrets.STANDARD_INITIAL_PASSWORD_HASH }}
      CONFIRMATION: ${{ inputs.confirmation }}
      # Hard-locked remote path relative to personelmedisa FTP root (no path input).
      REMOTE_CONFIG_PATH: api/config.local.php
      OPS_HELPER: scripts/ops/standard-initial-password-config-ops.php
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate authorization boundary and secrets
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "SET_STANDARD_INITIAL_PASSWORD_HASH" || {
            echo "Explicit SET_STANDARD_INITIAL_PASSWORD_HASH confirmation is required."
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP ops path." && exit 1)
          test -n "$STANDARD_INITIAL_PASSWORD_HASH" || {
            echo "STANDARD_INITIAL_PASSWORD_HASH secret is missing."
            echo "BLOCKER=STANDARD_INITIAL_PASSWORD_HASH_SECRET_MISSING"
            exit 1
          }
          test -f "$OPS_HELPER" || (echo "OPS helper missing." && exit 1)
          test "$REMOTE_CONFIG_PATH" = "api/config.local.php" || {
            echo "REMOTE_CONFIG_PATH lock violated."
            exit 1
          }

      - name: Install lftp and PHP CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp php-cli

      - name: Helper self-test
        run: |
          set -euo pipefail
          php "$OPS_HELPER" self-test
          php "$OPS_HELPER" target-key

      - name: Get → patch → put → readback (privacy-safe)
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/standard-initial-password-ops"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          BEFORE="$WORK/before.config.local.php"
          PATCHED="$WORK/patched.config.local.php"
          AFTER="$WORK/after.config.local.php"
          BACKUP="$WORK/backup.config.local.php"
          HASH_FILE="$WORK/hash.txt"

          cleanup_temp() {
            rm -rf "$WORK"
          }
          trap cleanup_temp EXIT

          # Secret reaches the helper only through a private file, never argv.
          printf '%s' "$STANDARD_INITIAL_PASSWORD_HASH" > "$HASH_FILE"
          chmod 600 "$HASH_FILE"
          php "$OPS_HELPER" validate-hash --hash-file="$HASH_FILE"

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Standard initial password hash transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"
            echo "Explicit FTPS port 21 deneniyor..."
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi
            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          echo "REMOTE_CONFIG_LOCATION=public_html/personelmedisa/api/config.local.php"
          echo "REMOTE_CONFIG_PATH=${REMOTE_CONFIG_PATH}"

          get_commands="get ${REMOTE_CONFIG_PATH} -o ${BEFORE};"
          if ! run_cpanel_ftp "$get_commands" >/dev/null 2>&1; then
            echo "REMOTE_CONFIG_READ=FAIL"
            echo "BLOCKER=REMOTE_CONFIG_GET_FAILED"
            exit 1
          fi
          test -s "$BEFORE" || {
            echo "REMOTE_CONFIG_READ=FAIL"
            echo "BLOCKER=REMOTE_CONFIG_EMPTY"
            exit 1
          }
          cp -f "$BEFORE" "$BACKUP"
          echo "REMOTE_CONFIG_READ=PASS"

          # Status flags only; the helper never prints the hash or sibling keys.
          BEFORE_OUT="$(php "$OPS_HELPER" get --file="$BEFORE")"
          printf 'BEFORE_%s\n' $BEFORE_OUT

          php "$OPS_HELPER" patch --file="$BEFORE" --out="$PATCHED" --hash-file="$HASH_FILE"
          php "$OPS_HELPER" assert-unrelated-equal --before="$BEFORE" --after="$PATCHED"

          CONFIG_UPLOAD=FAIL
          ROLLBACK=NOT_NEEDED

          REMOTE_TMP="api/config.local.php.ops-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
          put_commands="
            lcd ${WORK};
            put patched.config.local.php -o ${REMOTE_TMP};
            mv ${REMOTE_TMP} ${REMOTE_CONFIG_PATH};
          "
          if ! run_cpanel_ftp "$put_commands" >/dev/null 2>&1; then
            echo "CONFIG_UPLOAD=FAIL"
            echo "BLOCKER=CONFIG_UPLOAD_FAILED"
            exit 1
          fi
          CONFIG_UPLOAD=PASS
          echo "CONFIG_UPLOAD=PASS"

          attempt_rollback() {
            echo "Attempting rollback from runner-local backup..."
            local rollback_commands="
              lcd ${WORK};
              put backup.config.local.php -o ${REMOTE_CONFIG_PATH};
            "
            if run_cpanel_ftp "$rollback_commands" >/dev/null 2>&1; then
              ROLLBACK=PASS
            else
              ROLLBACK=FAIL
            fi
            echo "ROLLBACK=${ROLLBACK}"
          }

          rm -f "$AFTER"
          readback_commands="get ${REMOTE_CONFIG_PATH} -o ${AFTER};"
          if ! run_cpanel_ftp "$readback_commands" >/dev/null 2>&1; then
            echo "READBACK_MATCH=NO"
            echo "BLOCKER=READBACK_GET_FAILED"
            attempt_rollback
            exit 1
          fi

          AFTER_OUT="$(php "$OPS_HELPER" get --file="$AFTER")"
          printf 'AFTER_%s\n' $AFTER_OUT

          php "$OPS_HELPER" assert-unrelated-equal --before="$BEFORE" --after="$AFTER" || {
            echo "UNRELATED_CONFIG_KEYS_CHANGED detected after upload"
            echo "BLOCKER=UNRELATED_CONFIG_DELTA"
            attempt_rollback
            exit 1
          }

          if ! printf '%s\n' "$AFTER_OUT" | grep -qx 'STANDARD_INITIAL_PASSWORD_HASH_CONFIGURED=YES'; then
            echo "READBACK_MATCH=NO"
            echo "BLOCKER=READBACK_NOT_CONFIGURED"
            attempt_rollback
            exit 1
          fi

          echo "READBACK_MATCH=YES"
          echo "STANDARD_INITIAL_PASSWORD_HASH_CONFIGURED=YES"
          echo "UNRELATED_CONFIG_KEYS_CHANGED=0"
          echo "ROLLBACK=${ROLLBACK}"
          echo "HASH_EXPOSED=NO"
          echo "PLAINTEXT_EXPOSED=NO"
          echo "FULL_CONFIG_EXPOSED=NO"
          echo "CONFIG_ARTIFACT_UPLOADED=NO"
          echo "OPS_EXECUTION_OWNER=set-cpanel-standard-initial-password-hash.yml"
          echo "STANDARD_INITIAL_PASSWORD_OPS_STATUS=READY"
