name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          coverage: none

      - name: Install lftp for deploy fixture tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical state sync
        run: npm run check:sync

      - name: Run API parity gate
        run: npm run check:api-parity

      - name: Run type check
        run: npm run typecheck

      - name: Verify cPanel deploy safety contracts
        run: npm run verify:deploy-cpanel-safety

      - name: Run deterministic fast tests
        run: npm run test:ci-fast

      - name: Run build
        run: npm run build

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run mobile WebKit layout regression
        run: npx playwright test --project=webkit-mobile-regression
