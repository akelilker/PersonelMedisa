name: Apply cPanel migrations

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact deployed commit SHA shown by Deploy cPanel
        required: true
        type: string
      confirmation:
        description: Type APPLY_CANONICAL_MIGRATIONS to authorize this request
        required: true
        type: string

concurrency:
  group: cpanel-canonical-migration-control
  cancel-in-progress: false

jobs:
  request:
    name: Request canonical cPanel migration worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      POLL_ATTEMPTS: "151"
      POLL_INTERVAL_SECONDS: "10"
      TOTAL_POLL_WINDOW_SECONDS: "1500"
      CRON_INTERVAL_MINUTES: "15"
    steps:
      - name: Validate explicit request
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_CANONICAL_MIGRATIONS" || {
            echo "Explicit migration confirmation is required."
            exit 1
          }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "deployed_sha must be a full 40-character commit SHA."
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload one atomic migration request
        env:
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Migration transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"

            echo "Explicit FTPS port 21 deneniyor..."
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi

            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          preflight_dir="$RUNNER_TEMP/cpanel-migration-preflight"
          rm -rf "$preflight_dir"
          mkdir -p "$preflight_dir"
          preflight_commands="mirror --verbose=0 --include-glob status.json --include-glob request.pending.*.json --include-glob request.processing.*.json --exclude-glob * api/runtime/migration-control ${preflight_dir};"
          if ! run_cpanel_ftp "$preflight_commands" >/dev/null 2>&1; then
            echo "MIGRATION_CONTROL_PLANE_PREFLIGHT_FAILED"
            exit 1
          fi
          shopt -s nullglob
          pending_requests=("$preflight_dir"/request.pending.*.json)
          processing_requests=("$preflight_dir"/request.processing.*.json)
          shopt -u nullglob
          preflight_running="NO"
          if [[ -f "$preflight_dir/status.json" ]]; then
            preflight_state="$(jq -r '.state // empty' "$preflight_dir/status.json" 2>/dev/null || true)"
            if [[ "$preflight_state" == "RUNNING" ]]; then
              preflight_running="YES"
            fi
          fi
          if (( ${#pending_requests[@]} > 0 || ${#processing_requests[@]} > 0 )) || [[ "$preflight_running" == "YES" ]]; then
            echo "MIGRATION_CONTROL_PLANE_BUSY"
            if [[ ${#pending_requests[@]} -gt 0 ]]; then
              echo "MIGRATION_DIAG_PENDING_EXISTS=YES"
            else
              echo "MIGRATION_DIAG_PENDING_EXISTS=NO"
            fi
            if [[ ${#processing_requests[@]} -gt 0 ]]; then
              echo "MIGRATION_DIAG_PROCESSING_EXISTS=YES"
            else
              echo "MIGRATION_DIAG_PROCESSING_EXISTS=NO"
            fi
            echo "MIGRATION_DIAG_RUNNING_STATUS_EXISTS=${preflight_running}"
            exit 1
          fi

          request_dir="$RUNNER_TEMP/cpanel-migration-request"
          mkdir -p "$request_dir"
          request_file="$request_dir/request.${REQUEST_ID}.tmp"
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 1, request_id: $request_id, deployed_sha: $deployed_sha, requested_at: $requested_at}' \
            > "$request_file"

          request_commands="
            mkdir -p api/runtime/migration-control;
            lcd ${request_dir};
            put request.${REQUEST_ID}.tmp -O api/runtime/migration-control;
            mv api/runtime/migration-control/request.${REQUEST_ID}.tmp api/runtime/migration-control/request.pending.${REQUEST_ID}.json;
          "
          run_cpanel_ftp "$request_commands"

      - name: Wait for protected worker result
        env:
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Migration transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"

            echo "Explicit FTPS port 21 deneniyor..."
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi

            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          emit_matching_failure() {
            local failure_file="$1"
            local status_reason
            local status_stage
            local status_exit_code
            local status_detail

            status_reason="$(jq -r 'if (.reason | type) == "string" and (.reason | test("^[A-Z0-9_]+$")) then .reason else "UNKNOWN_MIGRATION_FAILURE" end' "$failure_file" 2>/dev/null || true)"
            status_stage="$(jq -r 'if (.stage | type) == "string" and (.stage | test("^[A-Z0-9_]+$")) then .stage else "UNKNOWN" end' "$failure_file" 2>/dev/null || true)"
            status_exit_code="$(jq -r 'if (.exit_code | type) == "number" and (.exit_code | floor) == .exit_code then (.exit_code | tostring) else "1" end' "$failure_file" 2>/dev/null || true)"
            status_detail="$(jq -r 'if (.detail | type) == "string" and .detail != "" then .detail else "NONE" end' "$failure_file" 2>/dev/null | tr '\r\n\t' ' ' | cut -c1-512 || true)"
            [[ "$status_reason" =~ ^[A-Z0-9_]+$ ]] || status_reason="UNKNOWN_MIGRATION_FAILURE"
            [[ "$status_stage" =~ ^[A-Z0-9_]+$ ]] || status_stage="UNKNOWN"
            [[ "$status_exit_code" =~ ^[0-9]+$ ]] || status_exit_code="1"
            [[ -n "$status_detail" ]] || status_detail="NONE"
            if [[ "$status_detail" == "NONE" || "$status_detail" =~ [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Bb][Ee][Aa][Rr][Ee][Rr]|[Dd][Ss][Nn] ]]; then
              status_detail="NONE"
            fi
            echo "MIGRATION_WORKER_STATE=FAILED"
            echo "MIGRATION_REASON=${status_reason}"
            echo "MIGRATION_STAGE=${status_stage}"
            echo "MIGRATION_EXIT_CODE=${status_exit_code}"
            echo "MIGRATION_SAFE_DETAIL=${status_detail}"
          }

          json_matches_request() {
            local candidate="$1"
            [[ -f "$candidate" ]] && jq -e --arg request_id "$REQUEST_ID" '.request_id == $request_id' "$candidate" >/dev/null 2>&1
          }

          status_file="$RUNNER_TEMP/cpanel-migration-status.json"
          poll_started_epoch="$(date +%s)"
          poll_deadline_epoch="$(( poll_started_epoch + TOTAL_POLL_WINDOW_SECONDS ))"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            rm -f "$status_file"
            status_commands="get api/runtime/migration-control/status.json -o ${status_file};"
            if run_cpanel_ftp "$status_commands" >/dev/null 2>&1; then
              status_request="$(jq -r '.request_id // empty' "$status_file" 2>/dev/null || true)"
              status_state="$(jq -r '.state // empty' "$status_file" 2>/dev/null || true)"
              if [[ "$status_request" == "$REQUEST_ID" && "$status_state" == "SUCCEEDED" ]]; then
                echo "Canonical migration worker completed."
                exit 0
              fi
              if [[ "$status_request" == "$REQUEST_ID" && "$status_state" == "FAILED" ]]; then
                emit_matching_failure "$status_file"
                exit 1
              fi
            fi
            now_epoch="$(date +%s)"
            if (( now_epoch >= poll_deadline_epoch )); then
              break
            fi
            remaining_seconds="$(( poll_deadline_epoch - now_epoch ))"
            sleep_seconds="$POLL_INTERVAL_SECONDS"
            if (( remaining_seconds < sleep_seconds )); then
              sleep_seconds="$remaining_seconds"
            fi
            sleep "$sleep_seconds"
          done

          # One final read-only inspection closes the observation race without
          # creating, moving, deleting, or retrying a migration request.
          diagnostic_dir="$RUNNER_TEMP/cpanel-migration-final-diagnostic"
          rm -rf "$diagnostic_dir"
          mkdir -p "$diagnostic_dir"
          diagnostic_commands="
            mirror --verbose=0 --include-glob status.json --include-glob request.pending.${REQUEST_ID}.json --include-glob request.processing.*.json --include-glob request.completed.${REQUEST_ID}.json --include-glob request.failed.${REQUEST_ID}.json --exclude-glob * api/runtime/migration-control ${diagnostic_dir};
          "
          diagnostic_ftp_ok="YES"
          if ! run_cpanel_ftp "$diagnostic_commands" >/dev/null 2>&1; then
            diagnostic_ftp_ok="NO"
          fi

          pending_match="NO"
          processing_match="NO"
          completed_match="NO"
          failed_match="NO"
          status_exists="NO"
          diagnostic_status_request=""
          diagnostic_status_state=""
          diagnostic_status_updated_at=""

          json_matches_request "$diagnostic_dir/request.pending.${REQUEST_ID}.json" && pending_match="YES"
          json_matches_request "$diagnostic_dir/request.completed.${REQUEST_ID}.json" && completed_match="YES"
          json_matches_request "$diagnostic_dir/request.failed.${REQUEST_ID}.json" && failed_match="YES"
          shopt -s nullglob
          for processing_file in "$diagnostic_dir"/request.processing.*.json; do
            if json_matches_request "$processing_file"; then
              processing_match="YES"
              break
            fi
          done
          shopt -u nullglob

          diagnostic_status_file="$diagnostic_dir/status.json"
          if [[ -f "$diagnostic_status_file" ]]; then
            status_exists="YES"
            diagnostic_status_request="$(jq -r '.request_id // empty' "$diagnostic_status_file" 2>/dev/null || true)"
            diagnostic_status_state="$(jq -r '.state // empty' "$diagnostic_status_file" 2>/dev/null || true)"
            diagnostic_status_updated_at="$(jq -r '.updated_at // empty' "$diagnostic_status_file" 2>/dev/null || true)"
          fi
          [[ "$diagnostic_status_request" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || diagnostic_status_request="NONE"
          [[ "$diagnostic_status_state" =~ ^(RUNNING|SUCCEEDED|FAILED)$ ]] || diagnostic_status_state="NONE"
          [[ "$diagnostic_status_updated_at" =~ ^[0-9TZ:._+-]{1,64}$ ]] || diagnostic_status_updated_at="NONE"

          echo "REQUEST_ID=${REQUEST_ID}"
          echo "MIGRATION_DIAG_PENDING_MATCH=${pending_match}"
          echo "MIGRATION_DIAG_PROCESSING_MATCH=${processing_match}"
          echo "MIGRATION_DIAG_COMPLETED_MATCH=${completed_match}"
          echo "MIGRATION_DIAG_FAILED_MATCH=${failed_match}"
          echo "MIGRATION_DIAG_STATUS_EXISTS=${status_exists}"
          echo "MIGRATION_DIAG_STATUS_REQUEST_ID=${diagnostic_status_request}"
          echo "MIGRATION_DIAG_STATUS_STATE=${diagnostic_status_state}"
          echo "MIGRATION_DIAG_STATUS_UPDATED_AT=${diagnostic_status_updated_at}"

          if [[ "$diagnostic_status_request" == "$REQUEST_ID" && "$diagnostic_status_state" == "FAILED" ]]; then
            emit_matching_failure "$diagnostic_status_file"
            exit 1
          fi
          if [[ "$failed_match" == "YES" ]]; then
            echo "MIGRATION_WORKER_STATE=FAILED"
            echo "MIGRATION_REASON=FAILED_ARCHIVE_OBSERVED"
            echo "MIGRATION_STAGE=UNKNOWN"
            echo "MIGRATION_EXIT_CODE=1"
            echo "MIGRATION_SAFE_DETAIL=NONE"
            exit 1
          fi
          if [[ "$diagnostic_status_request" == "$REQUEST_ID"
            && "$diagnostic_status_state" == "SUCCEEDED"
            && "$pending_match" == "NO" ]]; then
            echo "Canonical migration worker completed during final inspection."
            exit 0
          fi
          if [[ "$completed_match" == "YES"
            && "$failed_match" == "NO"
            && "$pending_match" == "NO"
            && "$processing_match" == "NO" ]]; then
            echo "Canonical migration completion archive matched during final inspection."
            exit 0
          fi

          elapsed_seconds="$(( $(date +%s) - poll_started_epoch ))"
          timeout_reason="UNKNOWN_CONTROL_PLANE_TIMEOUT"
          cron_worst_case_wait_seconds="$(( CRON_INTERVAL_MINUTES * 60 ))"
          if [[ "$processing_match" == "YES"
            || ( "$diagnostic_status_request" == "$REQUEST_ID" && "$diagnostic_status_state" == "RUNNING" ) ]]; then
            timeout_reason="WORKER_RUNNING_TIMEOUT"
          elif [[ "$pending_match" == "YES" && "$elapsed_seconds" -lt "$cron_worst_case_wait_seconds" ]]; then
            timeout_reason="WAITING_FOR_CRON_TICK"
          elif [[ "$pending_match" == "YES" ]]; then
            timeout_reason="REQUEST_NOT_CLAIMED"
          elif [[ "$status_exists" == "YES" && "$diagnostic_status_request" != "$REQUEST_ID" ]]; then
            timeout_reason="STATUS_TERMINAL_NOT_OBSERVED"
          elif [[ "$diagnostic_ftp_ok" == "YES" ]]; then
            timeout_reason="STATUS_TERMINAL_NOT_OBSERVED"
          fi
          echo "MIGRATION_WORKER_TIMEOUT"
          echo "MIGRATION_TIMEOUT_REASON=${timeout_reason}"
          exit 1
