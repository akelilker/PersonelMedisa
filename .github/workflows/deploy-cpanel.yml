name: Deploy cPanel

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: 24
      LOCAL_DIST_DIR: ./dist/
      LOCAL_REPO_DIR: ${{ github.workspace }}
      REMOTE_TARGET_DIR: .
      REMOTE_APP_PATH: public_html/personelmedisa
      MEDISA_MIGRATION_BASELINE: "067"
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout tested commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual dispatch ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_APP_BASE_PATH: /personelmedisa/
          VITE_API_MODE: real
          VITE_DEMO_API_FALLBACK: "false"
          VITE_ENABLE_DIAGNOSTICS: "false"
        run: npm run build

      - name: Validate SPA rewrite file
        run: |
          test -f dist/.htaccess || (echo "dist/.htaccess missing. SPA routes will 404." && exit 1)

      - name: Validate PHP API deploy files
        run: |
          test -f api/.htaccess || (echo "api/.htaccess missing." && exit 1)
          test -f api/public/index.php || (echo "api/public/index.php missing." && exit 1)
          test -f api/src/Router.php || (echo "api/src/Router.php missing." && exit 1)
          test ! -f api/config.local.php || (echo "api/config.local.php must not be committed or deployed from repo." && exit 1)

      - name: Validate deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test -n "$FTP_PORT" || (echo "FTP_PORT secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)
          test -n "$SMOKE_AUTH_USERNAME" || (echo "SMOKE_AUTH_USERNAME secret is missing." && exit 1)
          test -n "$SMOKE_AUTH_PASSWORD" || (echo "SMOKE_AUTH_PASSWORD secret is missing." && exit 1)
          test -n "$CPANEL_SSH_HOST" || (echo "CPANEL_SSH_HOST secret is missing." && exit 1)
          test -n "$CPANEL_SSH_PORT" || (echo "CPANEL_SSH_PORT secret is missing." && exit 1)
          test -n "$CPANEL_SSH_USER" || (echo "CPANEL_SSH_USER secret is missing." && exit 1)
          test -n "$CPANEL_SSH_PRIVATE_KEY" || (echo "CPANEL_SSH_PRIVATE_KEY secret is missing." && exit 1)
          test -n "$CPANEL_SSH_KNOWN_HOSTS" || (echo "CPANEL_SSH_KNOWN_HOSTS secret is missing." && exit 1)
          case "$CPANEL_SSH_PORT" in (*[!0-9]*|'') echo "CPANEL_SSH_PORT must be numeric." && exit 1;; esac

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload dist and PHP API to cPanel personelmedisa FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          LOCAL_DIST_DIR: ${{ env.LOCAL_DIST_DIR }}
          LOCAL_REPO_DIR: ${{ env.LOCAL_REPO_DIR }}
          REMOTE_TARGET_DIR: ${{ env.REMOTE_TARGET_DIR }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" > "$RUNNER_TEMP/.deploy-sha"

          deploy_with_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"

            echo "Deploy modu deneniyor: ${mode_name}"

            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set cmd:verbose on;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              lcd ${LOCAL_DIST_DIR%/};
              !echo 'FTP root hedefleniyor';
              cd ${REMOTE_TARGET_DIR};
              !echo 'SPA dist upload basliyor';
              mirror -R --verbose --exclude api/ --exclude-glob '.git*' --exclude-glob '.cpanel*' . .;
              !echo 'PHP API upload basliyor';
              lcd ${LOCAL_REPO_DIR};
              mkdir -p api;
              put -O api api/.htaccess;
              mirror -R --verbose api/public api/public;
              mirror -R --verbose api/src api/src;
              mirror -R --verbose api/bin api/bin;
              mirror -R --verbose api/migrations api/migrations;
              put -O api ${RUNNER_TEMP}/.deploy-sha;
              !echo 'upload tamamlandi';
              bye
            "
          }

          echo "Explicit FTPS port 21 deneniyor..."
          if deploy_with_ftp_mode "explicit-ftps" "true"; then
            exit 0
          fi

          echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
          deploy_with_ftp_mode "plain-ftp" "false"

      - name: Apply pending migrations over pinned SSH
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          REMOTE_APP_PATH: ${{ env.REMOTE_APP_PATH }}
          MEDISA_MIGRATION_BASELINE: ${{ env.MEDISA_MIGRATION_BASELINE }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/cpanel-deploy-key"
          known_hosts_file="$RUNNER_TEMP/cpanel-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh \
            -i "$key_file" \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" \
            "MEDISA_APP_PATH='${REMOTE_APP_PATH}' MEDISA_MIGRATION_BASELINE='${MEDISA_MIGRATION_BASELINE}' bash api/bin/run-production-migrations.sh '${DEPLOY_SHA}'"

      - name: Verify deployed app with anonymous and authenticated read-only smoke
        env:
          SMOKE_BASE_URL: https://www.karmotors.com.tr
          SMOKE_APP_PREFIX: /personelmedisa
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: npm run smoke:live
