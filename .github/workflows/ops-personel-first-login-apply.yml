name: HISTORICAL — Ops personel first-login APPLY (2026-09-19 rollout; NOT headcount)

# PERSONEL canonical first-login credential rollout icin KONTROLLU APPLY.
#
# Tek mod: PERSONEL_FIRST_LOGIN_CREDENTIALS_APPLY. Kontrol duzlemine tek bir request
# birakir; o request yalnizca mode + deployed_sha + expected_plan_fingerprint tasir.
# Personel id, username, password, filter, SQL veya aktor alani YOKTUR: cohort ve
# credential materyali canonical sahipte (PersonelAccountOnboardingService) kalir.
#
# Bu workflow'un yetkisi ACIK ve TEHLIKELIDIR: canonical owner'in apply yolunu cagirir
# ve production'da 125 PERSONEL hesabinin username + template sifre hash + zorunlu
# ilk giris sifre degisimi state'ini yazar. Bu yuzden:
#   - exact confirmation token zorunludur (APPLY_PERSONEL_FIRST_LOGIN_CREDENTIALS),
#   - request, preflight artifact'indan okunan EXACT plan fingerprint'ine pinlenir;
#     cohort kayarsa canonical owner hicbir satir yazmaz,
#   - repository private degilse request birakilmadan ONCE durur,
#   - apply TEK SEFERDIR: tamamlanmis rollout / daha once uygulanmis hedef fail-closed durur.
#
# Log sozlesmesi: yalnizca sayilar, reason code ve plan fingerprint. Plan satirlari
# artifact olarak yayinlanir. Plaintext sifre, password_hash ve recovery preimage
# ASLA loglanmaz ve ASLA artifact olarak yuklenmez: preimage kontrol duzleminde
# 0600 ile kalir (bkz. PersonelFirstLoginCredentialsApplyReport).

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PERSONEL_FIRST_LOGIN_CREDENTIALS to authorize this write
        required: true
        type: string
      deployed_sha:
        description: Exact deployed commit SHA containing this apply mode
        required: true
        type: string
      expected_plan_fingerprint:
        description: Exact plan fingerprint published by the read-only preflight
        required: true
        type: string

concurrency:
  group: cpanel-canonical-migration-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Controlled personel first-login credential apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      EXPECTED_PLAN_FINGERPRINT_INPUT: ${{ inputs.expected_plan_fingerprint }}
      MODE: PERSONEL_FIRST_LOGIN_CREDENTIALS_APPLY
      APPLY_CONFIRMATION_TOKEN: APPLY_PERSONEL_FIRST_LOGIN_CREDENTIALS
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      POLL_ATTEMPTS: "91"
      POLL_INTERVAL_SECONDS: "10"
      TOTAL_POLL_WINDOW_SECONDS: "900"

      # ---------------------------------------------------------------------
      # BIR SEFERLIK production pin'leri — TARIHSEL ROLLOUT KANITI, PERSONEL MEVCUDU DEGILDIR.
      # 134/125 degerleri 19.09.2026 first-login account cohort'udur; aktif personel headcount'i icin KULLANILMAZ.
      # Guncel HR snapshot kaniti: docs/guncel/145-personel-aktif-mevcudu-source-of-truth-2026-09-21.md
      #
      #
      # Bu sayilar YALNIZCA bu tek seferlik rollout apply'inda beklenir ve kasitli
      # olarak workflow icinde tutulur; canonical karar sahibine veya report
      # owner'ina GOMULMEZ. Orda sayi beklemek, cohort degistiginde gercek veriyi
      # "beklenen" degere uydurmaya calisan bir fail-open yolu olurdu. Burada gate,
      # kanit beklenenden saparsa isi DURDURUR; sessizce gecmez.
      # ---------------------------------------------------------------------
      EXPECTED_PERSONEL_TOTAL: "134"
      EXPECTED_TARGET_COUNT: "125"
      EXPECTED_EXCLUDED_TOTAL: "9"
      EXPECTED_EXCLUDED_USER_NOT_ACTIVE: "4"
      EXPECTED_EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE: "5"
      EXPECTED_EXCLUDED_PROTECTED_USERNAME: "0"
      EXPECTED_EXCLUDED_BINDING_MISSING: "0"
      EXPECTED_EXCLUDED_BOUND_PERSONEL_MISSING: "0"
      EXPECTED_NAME_UNRESOLVED: "0"
      EXPECTED_NAME_CORRECTION_COUNT: "5"
      EXPECTED_NAME_CORRECTION_PREIMAGE_MISMATCH: "0"
      EXPECTED_BUSINESS_OVERRIDE_COUNT: "3"
      EXPECTED_COLLISION_COUNT: "0"
      EXPECTED_PROTECTED_IN_PLAN: "0"
      EXPECTED_ROLLOUT_EXCLUDED_IN_PLAN: "0"
      EXPECTED_APPLY_COUNT: "125"
      EXPECTED_USER_MUTATION_COUNT: "125"
      EXPECTED_NAME_CORRECTION_MUTATION_COUNT: "5"
      # users satirlari + personeller name correction satirlari (125 + 5).
      EXPECTED_PRODUCTION_MUTATION_COUNT: "130"
      # Explicit business override + name correction ile beklenen plan kullanici adlari.
      EXPECTED_USERNAME_PLAN: "abdullah,fahriM,hakanAc,hakanAt,muqtadaK,oktayE,raedF,saifA"

    steps:
      # Publication boundary gate. Runs before checkout, before any FTP contact and
      # before any control-plane request, so a public repository never asks production
      # for a credential rollout. The value comes from GitHub's canonical repository
      # context, not from an input, and anything other than an explicit "true"
      # (including a missing context on an unexpected event) blocks: default-deny.
      - name: Validate repository publication boundary
        run: |
          set -euo pipefail
          if [ "${REPOSITORY_PRIVATE:-}" != "true" ]; then
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=PUBLIC_REPOSITORY_ARTIFACT_EXPOSURE"
            exit 1
          fi

      - name: Validate explicit apply request
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "$APPLY_CONFIRMATION_TOKEN" || {
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=CONFIRMATION_MISMATCH"
            exit 1
          }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=DEPLOYED_SHA_INPUT_INVALID"
            exit 1
          }
          [[ "${EXPECTED_PLAN_FINGERPRINT_INPUT,,}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=PLAN_FINGERPRINT_INPUT_INVALID"
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FTP client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Dispatch controlled apply and collect evidence
        run: |
          set -euo pipefail

          run_cpanel_plain_ftp() {
            local ftp_commands="$1"

            echo "Deploy transport mode: plain-ftp"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow false;
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            run_cpanel_plain_ftp "$1"
          }

          block() {
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=$1"
            exit 1
          }

          source "$GITHUB_WORKSPACE/scripts/deploy/cpanel-ftp-directory-lib.sh"

          WORK="$RUNNER_TEMP/personel-first-login-apply"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          if ! ensure_cpanel_remote_directory "api/runtime/migration-control"; then
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=CONTROL_PLANE_DIRECTORY_UNUSABLE"
            run_cpanel_ftp "cls -1 api/runtime/migration-control;" >/dev/null 2>&1 || true
            exit 1
          fi

          # Deploy SHA parity: the write must be performed by the exact code the caller
          # authorized, otherwise the mutation semantics are unknown.
          if ! run_cpanel_ftp "
            get api/.deploy-sha -o ${WORK}/deploy-sha.txt;
            get api/bin/cpanel-migration-cron.php -o ${WORK}/remote-worker.php;
          " >/dev/null 2>&1; then
            block CONTROL_PLANE_UNREACHABLE
          fi
          remote_sha="$(tr -d '\r\n' < "${WORK}/deploy-sha.txt" 2>/dev/null || true)"
          [[ "${remote_sha,,}" == "${DEPLOYED_SHA,,}" ]] || block DEPLOY_SHA_MISMATCH
          echo "APPLY_DEPLOY_SHA_MATCH=YES"

          # Worker parity + apply-mode ownership. A deployed worker that is not this
          # branch's worker is not the reviewed apply implementation, so no request is
          # written for it.
          local_worker_sha="$(sha256sum api/bin/cpanel-migration-cron.php | cut -d' ' -f1)"
          remote_worker_sha="$(sha256sum "${WORK}/remote-worker.php" | cut -d' ' -f1)"
          [[ "$local_worker_sha" == "$remote_worker_sha" ]] || block REMOTE_WORKER_PARITY_MISMATCH
          grep -q 'PERSONEL_FIRST_LOGIN_CREDENTIALS_APPLY' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_APPLY_MODE_MISSING
          grep -q 'PersonelFirstLoginCredentialsApplyReport' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_APPLY_OWNER_MISSING
          grep -q 'expected_plan_fingerprint' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_FINGERPRINT_GATE_MISSING
          # The canonical decision owner must be the deployed one; the apply path is not
          # allowed to grow a second credential implementation.
          grep -q 'PersonelAccountOnboardingService' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_CANONICAL_OWNER_MISSING
          echo "APPLY_WORKER_PARITY=YES"

          # Busy guard: the control plane is shared with the read-only preflight and the
          # mapping operations, so the apply must never queue behind or race another
          # request.
          listing="$WORK/control-listing.txt"
          if ! run_cpanel_ftp "cls -1 api/runtime/migration-control > ${listing};" >/dev/null 2>&1; then
            block CONTROL_PLANE_UNREACHABLE
          fi
          if grep -q 'request\.pending\.' "$listing"; then
            block MIGRATION_CONTROL_PLANE_BUSY
          fi
          if grep -q 'request\.processing\.' "$listing"; then
            block MIGRATION_CONTROL_PLANE_BUSY
          fi
          if grep -q '/status.json$' "$listing"; then
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${WORK}/status.json;" >/dev/null 2>&1; then
              if [[ "$(jq -r '.state // empty' "${WORK}/status.json" 2>/dev/null || true)" == "RUNNING" ]]; then
                block WORKER_BUSY
              fi
            fi
          fi
          echo "APPLY_WORKER_IDLE=YES"

          echo "APPLY_CONTROL_PLANE_FILES_BEFORE=$(grep -c 'request\.' "$listing" || true)"
          echo "APPLY_CONTROL_PLANE_BASELINE=${listing}"

          REQUEST_ID="pflcapply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "APPLY_REQUEST_ID=${REQUEST_ID}"
          request_dir="$WORK/request"
          mkdir -p "$request_dir"
          # The request carries a mode, a SHA and the pinned plan fingerprint and nothing
          # else: no personel id, no username, no password, no SQL, no filter and no actor.
          # There is no field an operator could use to ask for a different cohort.
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expected_plan_fingerprint "${EXPECTED_PLAN_FINGERPRINT_INPUT,,}" \
            '{schema_version: 1, request_id: $request_id, deployed_sha: $deployed_sha, requested_at: $requested_at, mode: "PERSONEL_FIRST_LOGIN_CREDENTIALS_APPLY", expected_plan_fingerprint: $expected_plan_fingerprint}' \
            > "$request_dir/request.${REQUEST_ID}.tmp"

          run_cpanel_ftp "
            lcd ${request_dir};
            put -O api/runtime/migration-control request.${REQUEST_ID}.tmp;
            mv api/runtime/migration-control/request.${REQUEST_ID}.tmp api/runtime/migration-control/request.pending.${REQUEST_ID}.json;
          "

          status_file="$WORK/poll-status.json"
          deadline="$(( $(date +%s) + TOTAL_POLL_WINDOW_SECONDS ))"
          worker_state="NONE"
          for _ in $(seq 1 "$POLL_ATTEMPTS"); do
            rm -f "$status_file"
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${status_file};" >/dev/null 2>&1; then
              if [[ "$(jq -r '.request_id // empty' "$status_file" 2>/dev/null || true)" == "$REQUEST_ID" ]]; then
                worker_state="$(jq -r '.state // "NONE"' "$status_file" 2>/dev/null || echo NONE)"
                if [[ "$worker_state" == "SUCCEEDED" || "$worker_state" == "FAILED" ]]; then
                  break
                fi
              fi
            fi
            if (( $(date +%s) >= deadline )); then
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "APPLY_WORKER_STATE=${worker_state}"

          mkdir -p "$GITHUB_WORKSPACE/apply-artifact"
          report="$WORK/personel-first-login-apply.json"
          report_fetched="NO"
          if run_cpanel_ftp "get api/runtime/migration-control/personel-first-login-apply.json -o ${report};" >/dev/null 2>&1; then
            report_fetched="YES"
            cp "$report" "$GITHUB_WORKSPACE/apply-artifact/personel-first-login-apply.json"
          fi
          # The recovery preimage is NEVER fetched and NEVER published: it carries the old
          # password_hash and stays a 0600 control-plane runtime artifact.

          if [[ "$worker_state" == "FAILED" ]]; then
            reason="$(jq -r 'if (.reason | type) == "string" and (.reason | test("^[A-Z0-9_]+$")) then .reason else "UNKNOWN_APPLY_FAILURE" end' "$status_file" 2>/dev/null || echo UNKNOWN_APPLY_FAILURE)"
            stage="$(jq -r 'if (.stage | type) == "string" and (.stage | test("^[A-Z0-9_]+$")) then .stage else "UNKNOWN" end' "$status_file" 2>/dev/null || echo UNKNOWN)"
            echo "APPLY_STAGE=${stage}"
            echo "APPLY_REPORT_FETCHED=${report_fetched}"
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=${reason}"
            exit 1
          fi
          if [[ "$worker_state" != "SUCCEEDED" ]]; then
            block WAITING_FOR_CRON_TICK
          fi
          [[ "$report_fetched" == "YES" ]] || block APPLY_REPORT_UNREADABLE

          # The report must be the one this request produced, pinned to the same SHA, mode
          # and fingerprint, otherwise a stale report would be read as this run's evidence.
          [[ "$(jq -r '.request_id // ""' "$report" 2>/dev/null || true)" == "$REQUEST_ID" ]] || block APPLY_REPORT_REQUEST_MISMATCH
          [[ "$(jq -r '.deployed_sha // ""' "$report" 2>/dev/null || true)" == "${DEPLOYED_SHA,,}" ]] || block APPLY_REPORT_SHA_MISMATCH
          [[ "$(jq -r '.mode // ""' "$report" 2>/dev/null || true)" == "$MODE" ]] || block APPLY_REPORT_MODE_MISMATCH
          [[ "$(jq -r '.expected_plan_fingerprint // ""' "$report" 2>/dev/null || true)" == "${EXPECTED_PLAN_FINGERPRINT_INPUT,,}" ]] || block APPLY_REPORT_FINGERPRINT_INPUT_MISMATCH
          [[ "$(jq -r '.plan_fingerprint // ""' "$report" 2>/dev/null || true)" == "${EXPECTED_PLAN_FINGERPRINT_INPUT,,}" ]] || block APPLY_REPORT_PLAN_FINGERPRINT_MISMATCH

          # Bounded, allowlisted summary. Plan rows stay in the artifact; only counts, the
          # expected-username match and reason codes reach this log. `a // b` is avoided as
          # the fallback: it would also fire on `false` and hide a proven negative.
          emit_scalar() {
            local label="$1"
            local filter="$2"
            local pattern="$3"
            local value
            value="$(jq -r "${filter} | if . == null then \"NONE\" else tostring end" "$report" 2>/dev/null || echo NONE)"
            [[ "$value" =~ $pattern ]] || value="NONE"
            echo "${label}=${value}"
          }

          emit_scalar APPLY_SCHEMA_VERSION '.schema_version' '^[0-9]{1,3}$'
          emit_scalar APPLY_GENERATED_AT '.generated_at' '^[0-9TZ:.+-]{1,64}$'
          emit_scalar APPLY_DEPLOY_SHA '.deployed_sha' '^[0-9a-f]{40}$'
          emit_scalar PERSONEL_TOTAL '.personel_total' '^-?[0-9]{1,12}$'
          emit_scalar TARGET_COUNT '.target_count' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_TOTAL '.excluded_total' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_USER_NOT_ACTIVE '.excluded_counts.user_not_active' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE '.excluded_counts.bound_personel_not_active' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_PROTECTED_USERNAME '.excluded_counts.protected_username' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BINDING_MISSING '.excluded_counts.binding_missing' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BOUND_PERSONEL_MISSING '.excluded_counts.bound_personel_missing' '^-?[0-9]{1,12}$'
          emit_scalar NAME_UNRESOLVED_COUNT '.name_unresolved_count' '^-?[0-9]{1,12}$'
          emit_scalar NAME_CORRECTION_COUNT '.name_correction_count' '^-?[0-9]{1,12}$'
          emit_scalar NAME_CORRECTION_PREIMAGE_MISMATCH_COUNT '.name_correction_preimage_mismatch_count' '^-?[0-9]{1,12}$'
          emit_scalar BUSINESS_OVERRIDE_COUNT '.business_override_count' '^-?[0-9]{1,12}$'
          emit_scalar COLLISION_COUNT '.collision_count' '^-?[0-9]{1,12}$'
          emit_scalar COHORT_RECONCILED '.cohort_reconciled' '^(true|false)$'
          emit_scalar PROTECTED_USERNAME_IN_PLAN_COUNT '.protected_username_in_plan_count' '^-?[0-9]{1,12}$'
          emit_scalar ROLLOUT_EXCLUDED_IN_PLAN_COUNT '.rollout_excluded_in_plan_count' '^-?[0-9]{1,12}$'
          emit_scalar ILKERA_TOUCHED '.ilkera_touched' '^(true|false)$'
          emit_scalar DECISION_APPLY '.decision_apply' '^(true|false)$'
          emit_scalar APPLIED_COUNT '.applied_count' '^-?[0-9]{1,12}$'
          emit_scalar USER_MUTATION_COUNT '.user_mutation_count' '^-?[0-9]{1,12}$'
          emit_scalar NAME_CORRECTION_MUTATION_COUNT '.name_correction_mutation_count' '^-?[0-9]{1,12}$'
          emit_scalar PRODUCTION_MUTATION_COUNT '.production_mutation_count' '^-?[0-9]{1,12}$'
          emit_scalar CREDENTIAL_TARGETS_RECONCILED '.credential_targets_reconciled' '^(true|false)$'
          emit_scalar EXCLUDED_UNCHANGED '.excluded_unchanged' '^(true|false)$'
          emit_scalar ILKERA_UNCHANGED '.ilkera_unchanged' '^(true|false)$'
          emit_scalar ROLLOUT_LEDGER_RECORDED '.rollout_ledger_recorded' '^(true|false)$'
          emit_scalar PREIMAGE_WRITTEN '.preimage_written' '^(true|false)$'
          emit_scalar PREIMAGE_SHA256 '.preimage_sha256' '^[0-9a-f]{64}$'
          emit_scalar PLAN_FINGERPRINT '.plan_fingerprint' '^[0-9a-f]{64}$'
          emit_scalar BLOCKER_COUNT '[.blockers[]?] | length' '^[0-9]{1,6}$'
          emit_scalar APPLY_RESULT '.result' '^(PASS|BLOCKED)$'

          if [[ "$(jq -r '.result // "BLOCKED"' "$report" 2>/dev/null || echo BLOCKED)" != "PASS" ]]; then
            echo "APPLY_BLOCKERS=$(jq -r '[.blockers[]? | tostring] | join(",")' "$report" 2>/dev/null | tr -cd 'A-Z0-9_,' || true)"
            echo "APPLY_REASON=$(jq -r 'if (.blocker | type) == "string" and (.blocker | test("^[A-Z0-9_]+$")) then .blocker else "UNKNOWN_APPLY_BLOCKER" end' "$report" 2>/dev/null || echo UNKNOWN_APPLY_BLOCKER)"
            echo "APPLY_RESULT=BLOCKED"
            exit 1
          fi

      # Hard fail-closed expectation gates. These run only after the report is proven to
      # be this run's own, and they never write anything anywhere: a mismatch stops the
      # workflow so the operator re-derives the expectation instead of proceeding on
      # drifted numbers. The cohort pins are re-checked here because the apply owner
      # re-derived the plan from production moments before the write.
      - name: Enforce one-time production apply expectations
        run: |
          set -euo pipefail

          report="$GITHUB_WORKSPACE/apply-artifact/personel-first-login-apply.json"
          [[ -f "$report" ]] || {
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=APPLY_REPORT_NOT_PUBLISHED"
            exit 1
          }

          gate() {
            local label="$1"
            local filter="$2"
            local expected="$3"
            local actual
            actual="$(jq -r "${filter} | if . == null then \"NONE\" else tostring end" "$report" 2>/dev/null || echo NONE)"
            if [[ "$actual" != "$expected" ]]; then
              echo "EXPECTED_GATE_${label}=MISMATCH"
              echo "EXPECTED_GATE_${label}_EXPECTED=${expected}"
              echo "EXPECTED_GATE_${label}_ACTUAL=${actual}"
              echo "APPLY_RESULT=BLOCKED"
              echo "APPLY_REASON=PRODUCTION_EXPECTATION_MISMATCH_${label}"
              exit 1
            fi
            echo "EXPECTED_GATE_${label}=MATCH"
          }

          gate PERSONEL_TOTAL '.personel_total' "$EXPECTED_PERSONEL_TOTAL"
          gate TARGET_COUNT '.target_count' "$EXPECTED_TARGET_COUNT"
          gate EXCLUDED_TOTAL '.excluded_total' "$EXPECTED_EXCLUDED_TOTAL"
          gate EXCLUDED_USER_NOT_ACTIVE '.excluded_counts.user_not_active' "$EXPECTED_EXCLUDED_USER_NOT_ACTIVE"
          gate EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE '.excluded_counts.bound_personel_not_active' "$EXPECTED_EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE"
          gate EXCLUDED_PROTECTED_USERNAME '.excluded_counts.protected_username' "$EXPECTED_EXCLUDED_PROTECTED_USERNAME"
          gate EXCLUDED_BINDING_MISSING '.excluded_counts.binding_missing' "$EXPECTED_EXCLUDED_BINDING_MISSING"
          gate EXCLUDED_BOUND_PERSONEL_MISSING '.excluded_counts.bound_personel_missing' "$EXPECTED_EXCLUDED_BOUND_PERSONEL_MISSING"
          gate NAME_UNRESOLVED_COUNT '.name_unresolved_count' "$EXPECTED_NAME_UNRESOLVED"
          gate NAME_CORRECTION_COUNT '.name_correction_count' "$EXPECTED_NAME_CORRECTION_COUNT"
          gate NAME_CORRECTION_PREIMAGE_MISMATCH_COUNT '.name_correction_preimage_mismatch_count' "$EXPECTED_NAME_CORRECTION_PREIMAGE_MISMATCH"
          gate BUSINESS_OVERRIDE_COUNT '.business_override_count' "$EXPECTED_BUSINESS_OVERRIDE_COUNT"
          gate COLLISION_COUNT '.collision_count' "$EXPECTED_COLLISION_COUNT"
          gate PROTECTED_USERNAME_IN_PLAN_COUNT '.protected_username_in_plan_count' "$EXPECTED_PROTECTED_IN_PLAN"
          gate ROLLOUT_EXCLUDED_IN_PLAN_COUNT '.rollout_excluded_in_plan_count' "$EXPECTED_ROLLOUT_EXCLUDED_IN_PLAN"
          gate COHORT_RECONCILED '.cohort_reconciled' "true"
          gate ILKERA_TOUCHED '.ilkera_touched' "false"
          gate DECISION_APPLY '.decision_apply' "true"
          gate APPLIED_COUNT '.applied_count' "$EXPECTED_APPLY_COUNT"
          gate USER_MUTATION_COUNT '.user_mutation_count' "$EXPECTED_USER_MUTATION_COUNT"
          gate NAME_CORRECTION_MUTATION_COUNT '.name_correction_mutation_count' "$EXPECTED_NAME_CORRECTION_MUTATION_COUNT"
          gate PRODUCTION_MUTATION_COUNT '.production_mutation_count' "$EXPECTED_PRODUCTION_MUTATION_COUNT"
          gate CREDENTIAL_TARGETS_RECONCILED '.credential_targets_reconciled' "true"
          gate EXCLUDED_UNCHANGED '.excluded_unchanged' "true"
          gate ILKERA_UNCHANGED '.ilkera_unchanged' "true"
          gate ROLLOUT_LEDGER_RECORDED '.rollout_ledger_recorded' "true"
          gate PREIMAGE_WRITTEN '.preimage_written' "true"
          gate PLAN_FINGERPRINT '.plan_fingerprint' "${EXPECTED_PLAN_FINGERPRINT_INPUT,,}"
          gate APPLY_RESULT '.result' "PASS"
          gate BLOCKER_COUNT '[.blockers[]?] | length' "0"

          # The rollout's business truth: the override/correction accounts must be in the
          # plan with the canonical usernames, and every plan username must be unique.
          actual_usernames="$(jq -r '[.plan[]?.new_username | strings] | unique | sort | join(",")' "$report" 2>/dev/null || echo "")"
          plan_rows="$(jq -r '[.plan[]?] | length' "$report" 2>/dev/null || echo -1)"
          unique_usernames="$(jq -r '[.plan[]?.new_username | strings] | unique | length' "$report" 2>/dev/null || echo -1)"
          [[ "$plan_rows" == "$unique_usernames" ]] || {
            echo "EXPECTED_GATE_PLAN_USERNAME_UNIQUE=MISMATCH"
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=PLAN_USERNAME_NOT_UNIQUE"
            exit 1
          }
          echo "EXPECTED_GATE_PLAN_USERNAME_UNIQUE=MATCH"

          for username in ${EXPECTED_USERNAME_PLAN//,/ }; do
            if ! printf '%s' ",${actual_usernames}," | grep -qF ",${username},"; then
              echo "EXPECTED_GATE_USERNAME_${username}=MISSING"
              echo "APPLY_RESULT=BLOCKED"
              echo "APPLY_REASON=EXPECTED_USERNAME_MISSING"
              exit 1
            fi
            echo "EXPECTED_GATE_USERNAME_${username}=PRESENT"
          done

          echo "APPLY_RESULT=PASS"
          echo "APPLY_REASON=NONE"

      # The control plane must be back to its pre-run shape plus exactly one new entry:
      # this run's own archived request. The judgement is scoped to this run's request id
      # and to the delta against the pre-write listing, so archived requests of earlier
      # operations can never be read as evidence about this run.
      - name: Verify control plane is left clean
        if: success()
        run: |
          set -euo pipefail

          request_id="pflcapply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work="$RUNNER_TEMP/personel-first-login-apply-final"
          rm -rf "$work"
          mkdir -p "$work"

          run_cpanel_plain_ftp() {
            local ftp_commands="$1"

            echo "Deploy transport mode: plain-ftp"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow false;
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            run_cpanel_plain_ftp "$1"
          }

          if ! run_cpanel_ftp "cls -1 api/runtime/migration-control > ${work}/control-listing-after.txt;" >/dev/null 2>&1; then
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=FINAL_CONTROL_PLANE_UNREACHABLE"
            exit 1
          fi
          source "$GITHUB_WORKSPACE/scripts/deploy/cpanel-control-plane-cleanliness-lib.sh"

          before_listing="$RUNNER_TEMP/personel-first-login-apply/control-listing.txt"
          after_listing="${work}/control-listing-after.txt"

          # The first-ever APPLY legitimately persists its own two control-plane outputs beside
          # this run's archived request: the secret-free apply report and the recovery preimage.
          # They are named EXACTLY here — no wildcard and no operation-prefix pattern — so any
          # other delta still blocks, and an entry here can never excuse a pending, failed or
          # processing request file. Naming the preimage is a delta declaration only: it is still
          # never fetched and never published by this workflow.
          expected_extra=(
            "personel-first-login-apply.json"
            "personel-first-login-apply-preimage.json"
          )

          if ! reason="$(assert_control_plane_clean_for_request "$before_listing" "$after_listing" "$request_id" "${expected_extra[@]}")"; then
            echo "APPLY_RESULT=BLOCKED"
            echo "APPLY_REASON=${reason}"
            exit 1
          fi

          echo "APPLY_CONTROL_PLANE_CLEAN=YES"

      # Publish the SECRET-FREE report only. The recovery preimage is deliberately not part
      # of this path, so it can never leave the control plane.
      - name: Publish apply evidence artifact
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v6
        with:
          name: personel-first-login-apply
          path: apply-artifact/
          retention-days: 7
          if-no-files-found: warn
