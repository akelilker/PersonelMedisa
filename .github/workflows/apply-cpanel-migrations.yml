name: Apply cPanel migrations

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact deployed commit SHA shown by Deploy cPanel
        required: true
        type: string
      confirmation:
        description: Type APPLY_CANONICAL_MIGRATIONS to authorize this request
        required: true
        type: string

concurrency:
  group: cpanel-canonical-migration-control
  cancel-in-progress: false

jobs:
  request:
    name: Request canonical cPanel migration worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      POLL_ATTEMPTS: "151"
      POLL_INTERVAL_SECONDS: "10"
      TOTAL_POLL_WINDOW_SECONDS: "1500"
      CRON_INTERVAL_MINUTES: "15"
    steps:
      - name: Validate explicit request
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_CANONICAL_MIGRATIONS" || {
            echo "Explicit migration confirmation is required."
            exit 1
          }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "deployed_sha must be a full 40-character commit SHA."
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Checkout repository
        uses: actions/checkout@v4

      # No migration request is created until the read-only preflight published by
      # `Ops migration worker diagnostics` (mode READ_ONLY_MIGRATION_PREFLIGHT)
      # proves the production ledger, schema, data guards and worker state. Every
      # failure here stops before the request is written and never touches a
      # migration file. worker.lock existence is deliberately not a gate: it is an
      # flock handle the worker never unlinks.
      - name: Verify read-only preflight evidence
        env:
          MAX_HEARTBEAT_AGE_SECONDS: "1800"
          MAX_PREFLIGHT_AGE_SECONDS: "86400"
          EXPECTED_PROD_TIP: "078"
          EXPECTED_PENDING: "079_aylik_kapanis_sube_scope_and_actor.sql"
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Gate transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi
            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          block() {
            echo "MIGRATION_GATE_RESULT=BLOCKED"
            echo "MIGRATION_GATE_REASON=$1"
            exit 1
          }

          WORK="$RUNNER_TEMP/migration-apply-gate"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          if ! run_cpanel_ftp "
            cls -1 api/runtime/migration-control > ${WORK}/control-listing.txt;
            get api/.deploy-sha -o ${WORK}/deploy-sha.txt;
            get api/bin/cpanel-migration-cron.php -o ${WORK}/remote-worker.php;
            get api/runtime/migration-control/worker-heartbeat.json -o ${WORK}/heartbeat.json;
            get api/runtime/migration-control/preflight.json -o ${WORK}/preflight.json;
          " >/dev/null 2>&1; then
            block CONTROL_PLANE_EVIDENCE_UNREADABLE
          fi

          expected_sha="$(echo "$DEPLOYED_SHA" | tr '[:upper:]' '[:lower:]')"

          remote_sha="$(tr -d '\r\n' < "${WORK}/deploy-sha.txt" | tr '[:upper:]' '[:lower:]')"
          [[ "$remote_sha" == "$expected_sha" ]] || block DEPLOY_SHA_MISMATCH
          echo "GATE_DEPLOY_SHA_MATCH=YES"

          heartbeat_sha="$(jq -r '.deployed_sha // "NONE"' "${WORK}/heartbeat.json" 2>/dev/null || echo NONE)"
          [[ "$heartbeat_sha" == "$expected_sha" ]] || block HEARTBEAT_DEPLOY_SHA_MISMATCH
          heartbeat_at="$(jq -r '.updated_at // "NONE"' "${WORK}/heartbeat.json" 2>/dev/null || echo NONE)"
          heartbeat_epoch="$(date -u -d "$heartbeat_at" +%s 2>/dev/null || echo 0)"
          heartbeat_age="$(( $(date -u +%s) - heartbeat_epoch ))"
          (( heartbeat_epoch > 0 && heartbeat_age <= MAX_HEARTBEAT_AGE_SECONDS )) || block HEARTBEAT_STALE
          echo "GATE_HEARTBEAT_AGE_SECONDS=${heartbeat_age}"

          # The deployed worker must be the one that owns the mandatory backup
          # stage; an older worker would apply 079 with no dump behind it.
          local_worker_sha="$(sha256sum api/bin/cpanel-migration-cron.php | cut -d' ' -f1)"
          remote_worker_sha="$(sha256sum "${WORK}/remote-worker.php" | cut -d' ' -f1)"
          [[ "$local_worker_sha" == "$remote_worker_sha" ]] || block REMOTE_WORKER_PARITY_MISMATCH
          grep -q 'MigrationBackupService' "${WORK}/remote-worker.php" || block WORKER_BACKUP_STAGE_MISSING
          echo "GATE_REMOTE_WORKER_PARITY=YES"

          # `set -e` makes `grep -q ... && block ...` abort the step on a non-match,
          # which would report a healthy control plane as a failure, so every probe
          # here stays an explicit if.
          if grep -q 'request\.processing\.' "${WORK}/control-listing.txt"; then
            block STALE_PROCESSING_REQUEST
          fi
          if grep -q 'request\.pending\.' "${WORK}/control-listing.txt"; then
            block MIGRATION_CONTROL_PLANE_BUSY
          fi
          if grep -q '/status.json$' "${WORK}/control-listing.txt"; then
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${WORK}/status.json;" >/dev/null 2>&1; then
              if [[ "$(jq -r '.state // empty' "${WORK}/status.json" 2>/dev/null || true)" == "RUNNING" ]]; then
                block WORKER_BUSY
              fi
            fi
          fi
          echo "GATE_WORKER_IDLE=YES"

          preflight_result="$(jq -r '.result // "BLOCKED"' "${WORK}/preflight.json" 2>/dev/null || echo BLOCKED)"
          [[ "$preflight_result" == "PASS" ]] || block PREFLIGHT_NOT_PASS
          preflight_sha="$(jq -r '.deployed_sha // "NONE"' "${WORK}/preflight.json" 2>/dev/null || echo NONE)"
          [[ "$preflight_sha" == "$expected_sha" ]] || block PREFLIGHT_SHA_MISMATCH
          preflight_at="$(jq -r '.generated_at // "NONE"' "${WORK}/preflight.json" 2>/dev/null || echo NONE)"
          preflight_epoch="$(date -u -d "$preflight_at" +%s 2>/dev/null || echo 0)"
          preflight_age="$(( $(date -u +%s) - preflight_epoch ))"
          (( preflight_epoch > 0 && preflight_age <= MAX_PREFLIGHT_AGE_SECONDS )) || block PREFLIGHT_STALE
          echo "GATE_PREFLIGHT_AGE_SECONDS=${preflight_age}"

          prod_tip="$(jq -r '.ledger.applied_tip // "NONE"' "${WORK}/preflight.json" 2>/dev/null || echo NONE)"
          [[ "$prod_tip" == "$EXPECTED_PROD_TIP" ]] || block PROD_TIP_UNEXPECTED
          pending="$(jq -r '[.ledger.pending_names[]?] | join(",")' "${WORK}/preflight.json" 2>/dev/null || echo NONE)"
          [[ "$pending" == "$EXPECTED_PENDING" ]] || block PENDING_NOT_ONLY_079
          echo "GATE_PROD_TIP=${prod_tip}"
          echo "GATE_PENDING=${pending}"

          # The bundle checksum the worker will apply must be the checksum of the
          # 079 file on this ref, otherwise the request would apply other bytes.
          expected_checksum="$(sha256sum "api/migrations/${EXPECTED_PENDING}" | cut -d' ' -f1)"
          preflight_checksum="$(jq -r '.bundle.expected_pending_checksum // "NONE"' "${WORK}/preflight.json" 2>/dev/null || echo NONE)"
          [[ "$preflight_checksum" == "$expected_checksum" ]] || block PENDING_CHECKSUM_MISMATCH
          echo "GATE_PENDING_CHECKSUM_MATCH=YES"

          mismatch="$(jq -r '[.ledger.checksum_mismatch_versions[]?] | length' "${WORK}/preflight.json" 2>/dev/null || echo 1)"
          gaps="$(jq -r '[.ledger.gap_versions[]?] | length' "${WORK}/preflight.json" 2>/dev/null || echo 1)"
          (( mismatch == 0 )) || block APPLIED_MIGRATION_MODIFIED
          (( gaps == 0 )) || block MIGRATION_LEDGER_GAP

          blockers="$(jq -r '[.blockers[]?] | length' "${WORK}/preflight.json" 2>/dev/null || echo 1)"
          (( blockers == 0 )) || block PREFLIGHT_BLOCKERS_PRESENT
          orphans="$(jq -r '.guards.ozet_sube_orphan_rows // -1' "${WORK}/preflight.json" 2>/dev/null || echo -1)"
          duplicates="$(jq -r '.guards.ozet_duplicate_ay_sube_personel // -1' "${WORK}/preflight.json" 2>/dev/null || echo -1)"
          state_dup="$(jq -r '.guards.state_duplicate_ay // -1' "${WORK}/preflight.json" 2>/dev/null || echo -1)"
          (( orphans == 0 )) || block DATA_GUARD_ORPHAN_SUBE_ROWS
          (( duplicates == 0 )) || block DATA_GUARD_DUPLICATE_ROWS
          (( state_dup == 0 )) || block DATA_GUARD_DUPLICATE_STATE_MONTHS
          echo "GATE_DATA_GUARDS=PASS"

          echo "MIGRATION_GATE_RESULT=PASS"

      - name: Upload one atomic migration request
        env:
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Migration transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"

            echo "Explicit FTPS port 21 deneniyor..."
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi

            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          # A directory listing is the only pattern proven to observe this cPanel
          # control plane; a silently empty glob mirror made the busy guard fail
          # open and let unclaimed requests pile up.
          preflight_dir="$RUNNER_TEMP/cpanel-migration-preflight"
          rm -rf "$preflight_dir"
          mkdir -p "$preflight_dir"
          preflight_listing="$preflight_dir/control-listing.txt"
          preflight_commands="cls -1 api/runtime/migration-control > ${preflight_listing};"
          if ! run_cpanel_ftp "$preflight_commands" >/dev/null 2>&1; then
            echo "MIGRATION_CONTROL_PLANE_PREFLIGHT_FAILED"
            exit 1
          fi
          pending_count="$(grep -c 'request\.pending\.' "$preflight_listing" || true)"
          processing_count="$(grep -c 'request\.processing\.' "$preflight_listing" || true)"
          [[ "$pending_count" =~ ^[0-9]+$ ]] || pending_count=0
          [[ "$processing_count" =~ ^[0-9]+$ ]] || processing_count=0
          preflight_running="NO"
          if grep -q 'status\.json' "$preflight_listing"; then
            preflight_status_file="$preflight_dir/status.json"
            rm -f "$preflight_status_file"
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${preflight_status_file};" >/dev/null 2>&1; then
              preflight_state="$(jq -r '.state // empty' "$preflight_status_file" 2>/dev/null || true)"
              if [[ "$preflight_state" == "RUNNING" ]]; then
                preflight_running="YES"
              fi
            fi
          fi
          pending_requests=()
          processing_requests=()
          for _ in $(seq 1 "$pending_count"); do pending_requests+=("pending"); done
          for _ in $(seq 1 "$processing_count"); do processing_requests+=("processing"); done
          if (( ${#pending_requests[@]} > 0 || ${#processing_requests[@]} > 0 )) || [[ "$preflight_running" == "YES" ]]; then
            echo "MIGRATION_CONTROL_PLANE_BUSY"
            if [[ ${#pending_requests[@]} -gt 0 ]]; then
              echo "MIGRATION_DIAG_PENDING_EXISTS=YES"
            else
              echo "MIGRATION_DIAG_PENDING_EXISTS=NO"
            fi
            if [[ ${#processing_requests[@]} -gt 0 ]]; then
              echo "MIGRATION_DIAG_PROCESSING_EXISTS=YES"
            else
              echo "MIGRATION_DIAG_PROCESSING_EXISTS=NO"
            fi
            echo "MIGRATION_DIAG_RUNNING_STATUS_EXISTS=${preflight_running}"
            exit 1
          fi

          request_dir="$RUNNER_TEMP/cpanel-migration-request"
          mkdir -p "$request_dir"
          request_file="$request_dir/request.${REQUEST_ID}.tmp"
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 1, request_id: $request_id, deployed_sha: $deployed_sha, requested_at: $requested_at}' \
            > "$request_file"

          request_commands="
            mkdir -p api/runtime/migration-control;
            lcd ${request_dir};
            put -O api/runtime/migration-control request.${REQUEST_ID}.tmp;
            mv api/runtime/migration-control/request.${REQUEST_ID}.tmp api/runtime/migration-control/request.pending.${REQUEST_ID}.json;
          "
          run_cpanel_ftp "$request_commands"

      - name: Wait for protected worker result
        env:
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          run_ftp_mode() {
            local mode_name="$1"
            local use_ftps="$2"
            local ftp_commands="$3"

            echo "Migration transport mode: ${mode_name}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow ${use_ftps};
              set ftp:ssl-force ${use_ftps};
              set ftp:ssl-protect-data ${use_ftps};
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            local ftp_commands="$1"

            echo "Explicit FTPS port 21 deneniyor..."
            if run_ftp_mode "explicit-ftps" "true" "$ftp_commands"; then
              return 0
            fi

            echo "Explicit FTPS basarisiz oldu, plain FTP fallback deneniyor..."
            run_ftp_mode "plain-ftp" "false" "$ftp_commands"
          }

          emit_matching_failure() {
            local failure_file="$1"
            local status_reason
            local status_stage
            local status_exit_code
            local status_detail

            status_reason="$(jq -r 'if (.reason | type) == "string" and (.reason | test("^[A-Z0-9_]+$")) then .reason else "UNKNOWN_MIGRATION_FAILURE" end' "$failure_file" 2>/dev/null || true)"
            status_stage="$(jq -r 'if (.stage | type) == "string" and (.stage | test("^[A-Z0-9_]+$")) then .stage else "UNKNOWN" end' "$failure_file" 2>/dev/null || true)"
            status_exit_code="$(jq -r 'if (.exit_code | type) == "number" and (.exit_code | floor) == .exit_code then (.exit_code | tostring) else "1" end' "$failure_file" 2>/dev/null || true)"
            status_detail="$(jq -r 'if (.detail | type) == "string" and .detail != "" then .detail else "NONE" end' "$failure_file" 2>/dev/null | tr '\r\n\t' ' ' | cut -c1-512 || true)"
            [[ "$status_reason" =~ ^[A-Z0-9_]+$ ]] || status_reason="UNKNOWN_MIGRATION_FAILURE"
            [[ "$status_stage" =~ ^[A-Z0-9_]+$ ]] || status_stage="UNKNOWN"
            [[ "$status_exit_code" =~ ^[0-9]+$ ]] || status_exit_code="1"
            [[ -n "$status_detail" ]] || status_detail="NONE"
            if [[ "$status_detail" == "NONE" || "$status_detail" =~ [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Bb][Ee][Aa][Rr][Ee][Rr]|[Dd][Ss][Nn] ]]; then
              status_detail="NONE"
            fi
            echo "MIGRATION_WORKER_STATE=FAILED"
            echo "MIGRATION_REASON=${status_reason}"
            echo "MIGRATION_STAGE=${status_stage}"
            echo "MIGRATION_EXIT_CODE=${status_exit_code}"
            echo "MIGRATION_SAFE_DETAIL=${status_detail}"
          }

          emit_failed_archive_failure() {
            local archive_file="$1"
            if [[ ! -f "$archive_file" ]]; then
              echo "MIGRATION_WORKER_STATE=FAILED"
              echo "MIGRATION_REASON=FAILED_ARCHIVE_OBSERVED"
              echo "MIGRATION_STAGE=UNKNOWN"
              echo "MIGRATION_EXIT_CODE=1"
              echo "MIGRATION_SAFE_DETAIL=NONE"
              return
            fi
            emit_matching_failure "$archive_file"
          }

          # A SUCCEEDED apply must be able to name the dump it was taken behind,
          # otherwise there is no rollback artifact for the post-apply window.
          assert_backup_evidence() {
            local status_json="$1"
            local file sha bytes readback
            file="$(jq -r 'if (.backup_file | type) == "string" and (.backup_file | test("^[A-Za-z0-9._-]{1,128}$")) then .backup_file else "NONE" end' "$status_json" 2>/dev/null || echo NONE)"
            sha="$(jq -r 'if (.backup_sha256 | type) == "string" and (.backup_sha256 | test("^[0-9a-f]{64}$")) then .backup_sha256 else "NONE" end' "$status_json" 2>/dev/null || echo NONE)"
            bytes="$(jq -r 'if (.backup_bytes | type) == "number" then (.backup_bytes | tostring) else "NONE" end' "$status_json" 2>/dev/null || echo NONE)"
            readback="$(jq -r 'if (.backup_readback | type) == "string" and (.backup_readback | test("^[A-Z_]{1,32}$")) then .backup_readback else "NONE" end' "$status_json" 2>/dev/null || echo NONE)"
            echo "MIGRATION_BACKUP_FILE=${file}"
            echo "MIGRATION_BACKUP_SHA256=${sha}"
            echo "MIGRATION_BACKUP_BYTES=${bytes}"
            echo "MIGRATION_BACKUP_READBACK=${readback}"
            if [[ "$file" == "NONE" || "$sha" == "NONE" || "$readback" != "VERIFIED" ]]; then
              echo "MIGRATION_BACKUP_EVIDENCE=MISSING"
              return 1
            fi
            echo "MIGRATION_BACKUP_EVIDENCE=VERIFIED"
          }

          json_matches_request() {
            local candidate="$1"
            [[ -f "$candidate" ]] && jq -e --arg request_id "$REQUEST_ID" '.request_id == $request_id' "$candidate" >/dev/null 2>&1
          }

          status_file="$RUNNER_TEMP/cpanel-migration-status.json"
          poll_started_epoch="$(date +%s)"
          poll_deadline_epoch="$(( poll_started_epoch + TOTAL_POLL_WINDOW_SECONDS ))"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            rm -f "$status_file"
            status_commands="get api/runtime/migration-control/status.json -o ${status_file};"
            if run_cpanel_ftp "$status_commands" >/dev/null 2>&1; then
              status_request="$(jq -r '.request_id // empty' "$status_file" 2>/dev/null || true)"
              status_state="$(jq -r '.state // empty' "$status_file" 2>/dev/null || true)"
              if [[ "$status_request" == "$REQUEST_ID" && "$status_state" == "SUCCEEDED" ]]; then
                echo "Canonical migration worker completed."
                assert_backup_evidence "$status_file" || exit 1
                exit 0
              fi
              if [[ "$status_request" == "$REQUEST_ID" && "$status_state" == "FAILED" ]]; then
                emit_matching_failure "$status_file"
                exit 1
              fi
            fi
            now_epoch="$(date +%s)"
            if (( now_epoch >= poll_deadline_epoch )); then
              break
            fi
            remaining_seconds="$(( poll_deadline_epoch - now_epoch ))"
            sleep_seconds="$POLL_INTERVAL_SECONDS"
            if (( remaining_seconds < sleep_seconds )); then
              sleep_seconds="$remaining_seconds"
            fi
            sleep "$sleep_seconds"
          done

          # One final read-only inspection closes the observation race without
          # creating, moving, deleting, or retrying a migration request.
          diagnostic_dir="$RUNNER_TEMP/cpanel-migration-final-diagnostic"
          rm -rf "$diagnostic_dir"
          mkdir -p "$diagnostic_dir"
          diagnostic_listing="$diagnostic_dir/control-listing.txt"
          diagnostic_commands="
            cls -1 api/runtime/migration-control > ${diagnostic_listing};
          "
          diagnostic_ftp_ok="YES"
          if ! run_cpanel_ftp "$diagnostic_commands" >/dev/null 2>&1; then
            diagnostic_ftp_ok="NO"
          fi

          pending_match="NO"
          processing_match="NO"
          completed_match="NO"
          failed_match="NO"
          status_exists="NO"
          diagnostic_status_request=""
          diagnostic_status_state=""
          diagnostic_status_updated_at=""

          fetch_diagnostic_entry() {
            local remote_name="$1"
            local local_path="$2"
            rm -f "$local_path"
            grep -q "${remote_name}" "$diagnostic_listing" 2>/dev/null || return 1
            run_cpanel_ftp "get api/runtime/migration-control/${remote_name} -o ${local_path};" >/dev/null 2>&1
          }

          if fetch_diagnostic_entry "request.pending.${REQUEST_ID}.json" "$diagnostic_dir/request.pending.${REQUEST_ID}.json"; then
            json_matches_request "$diagnostic_dir/request.pending.${REQUEST_ID}.json" && pending_match="YES"
          fi
          if fetch_diagnostic_entry "request.completed.${REQUEST_ID}.json" "$diagnostic_dir/request.completed.${REQUEST_ID}.json"; then
            json_matches_request "$diagnostic_dir/request.completed.${REQUEST_ID}.json" && completed_match="YES"
          fi
          if fetch_diagnostic_entry "request.failed.${REQUEST_ID}.json" "$diagnostic_dir/request.failed.${REQUEST_ID}.json"; then
            json_matches_request "$diagnostic_dir/request.failed.${REQUEST_ID}.json" && failed_match="YES"
          fi
          if grep -q 'request\.processing\.' "$diagnostic_listing" 2>/dev/null; then
            processing_match="YES"
          fi

          diagnostic_status_file="$diagnostic_dir/status.json"
          if fetch_diagnostic_entry "status.json" "$diagnostic_status_file"; then
            status_exists="YES"
            diagnostic_status_request="$(jq -r '.request_id // empty' "$diagnostic_status_file" 2>/dev/null || true)"
            diagnostic_status_state="$(jq -r '.state // empty' "$diagnostic_status_file" 2>/dev/null || true)"
            diagnostic_status_updated_at="$(jq -r '.updated_at // empty' "$diagnostic_status_file" 2>/dev/null || true)"
          fi
          [[ "$diagnostic_status_request" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || diagnostic_status_request="NONE"
          [[ "$diagnostic_status_state" =~ ^(RUNNING|SUCCEEDED|FAILED)$ ]] || diagnostic_status_state="NONE"
          [[ "$diagnostic_status_updated_at" =~ ^[0-9TZ:._+-]{1,64}$ ]] || diagnostic_status_updated_at="NONE"

          echo "REQUEST_ID=${REQUEST_ID}"
          echo "MIGRATION_DIAG_PENDING_MATCH=${pending_match}"
          echo "MIGRATION_DIAG_PROCESSING_MATCH=${processing_match}"
          echo "MIGRATION_DIAG_COMPLETED_MATCH=${completed_match}"
          echo "MIGRATION_DIAG_FAILED_MATCH=${failed_match}"
          echo "MIGRATION_DIAG_STATUS_EXISTS=${status_exists}"
          echo "MIGRATION_DIAG_STATUS_REQUEST_ID=${diagnostic_status_request}"
          echo "MIGRATION_DIAG_STATUS_STATE=${diagnostic_status_state}"
          echo "MIGRATION_DIAG_STATUS_UPDATED_AT=${diagnostic_status_updated_at}"

          if [[ "$diagnostic_status_request" == "$REQUEST_ID" && "$diagnostic_status_state" == "FAILED" ]]; then
            emit_matching_failure "$diagnostic_status_file"
            exit 1
          fi
          if [[ "$failed_match" == "YES" ]]; then
            emit_failed_archive_failure "$diagnostic_dir/request.failed.${REQUEST_ID}.json"
            exit 1
          fi
          if [[ "$diagnostic_status_request" == "$REQUEST_ID"
            && "$diagnostic_status_state" == "SUCCEEDED"
            && "$pending_match" == "NO" ]]; then
            echo "Canonical migration worker completed during final inspection."
            assert_backup_evidence "$diagnostic_status_file" || exit 1
            exit 0
          fi
          if [[ "$completed_match" == "YES"
            && "$failed_match" == "NO"
            && "$pending_match" == "NO"
            && "$processing_match" == "NO" ]]; then
            echo "Canonical migration completion archive matched during final inspection."
            # The archive proves completion but carries no backup metadata, so the
            # dump has to be confirmed from status.json or the backup directory.
            echo "MIGRATION_BACKUP_EVIDENCE=NOT_OBSERVED"
            exit 0
          fi

          elapsed_seconds="$(( $(date +%s) - poll_started_epoch ))"
          timeout_reason="UNKNOWN_CONTROL_PLANE_TIMEOUT"
          cron_worst_case_wait_seconds="$(( CRON_INTERVAL_MINUTES * 60 ))"
          if [[ "$processing_match" == "YES"
            || ( "$diagnostic_status_request" == "$REQUEST_ID" && "$diagnostic_status_state" == "RUNNING" ) ]]; then
            timeout_reason="WORKER_RUNNING_TIMEOUT"
          elif [[ "$pending_match" == "YES" && "$elapsed_seconds" -lt "$cron_worst_case_wait_seconds" ]]; then
            timeout_reason="WAITING_FOR_CRON_TICK"
          elif [[ "$pending_match" == "YES" ]]; then
            timeout_reason="REQUEST_NOT_CLAIMED"
          elif [[ "$status_exists" == "YES" && "$diagnostic_status_request" != "$REQUEST_ID" ]]; then
            timeout_reason="STATUS_TERMINAL_NOT_OBSERVED"
          elif [[ "$diagnostic_ftp_ok" == "YES" ]]; then
            timeout_reason="STATUS_TERMINAL_NOT_OBSERVED"
          fi
          echo "MIGRATION_WORKER_TIMEOUT"
          echo "MIGRATION_TIMEOUT_REASON=${timeout_reason}"
          exit 1
