name: Ops personel first-login preflight (read-only)

# PERSONEL canonical first-login credential rollout icin SALT-OKUNUR production preflight.
#
# Tek mod: PERSONEL_FIRST_LOGIN_CREDENTIALS_PREFLIGHT. Kontrol duzlemine tek bir
# request birakir; worker production DB'de SADECE SELECT calistirip canonical
# karar sahibinden (PersonelAccountOnboardingService) dry-run planini ister ve
# personel-first-login-preflight.json uretir. INSERT/UPDATE/DELETE/DDL, migration
# apply, backup, ledger yazimi, username/password/activation mutation ve APPLY
# modu bu yolda YOKTUR; modun apply karsiligi da yoktur.
#
# Bu workflow'un apply yetkisi yoktur ve apply request'i yazamaz. Ayrica
# api/bin/personel-first-login-credentials.php (canonical CLI worker) BURADAN
# CAGRILMAZ: o worker cPanel host'una ozel DB erisimi gerektirir, bu yuzden
# ayni canonical karar sahibi kontrol duzlemi uzerinden salt-okunur sorgulanir.
#
# Log sozlesmesi: yalnizca sayilar ve reason code. Plan satirlari (kullanici adi
# ve personel id) log'a dokulmez; artifact olarak yayinlanir ve yalnizca plan
# kapsaminda beklenen kullanici adi kumesi MATCH/MISMATCH olarak ozetlenir.
#
# Bu artifact'in gizliligi TAMAMEN repository visibility'sine baglidir: GitHub
# Actions artifact'i public repository'de signed-in herhangi bir kullanici
# indirebilir. Bu yuzden artifact yolu "her zaman private" degildir ve public
# repository'de guvenli kabul EDILEMEZ.
#
# Fail-closed sinir: repository private degilse preflight operasyonu
# control-plane request'i birakilmadan ONCE durur
# (PUBLIC_REPOSITORY_ARTIFACT_EXPOSURE). retention-days dusurmek, artifact adini
# gizlemek veya yalnizca uyarmak cozum degildir; kullanici adi/plan verisi
# public repository'de kisa sureli de yayinlanmaz.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PERSONEL_FIRST_LOGIN_CREDENTIALS_PREFLIGHT to authorize this read
        required: true
        type: string
      deployed_sha:
        description: Exact deployed commit SHA containing this preflight mode
        required: true
        type: string

concurrency:
  group: cpanel-canonical-migration-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only personel first-login preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      MODE: PERSONEL_FIRST_LOGIN_CREDENTIALS_PREFLIGHT
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      POLL_ATTEMPTS: "91"
      POLL_INTERVAL_SECONDS: "10"
      TOTAL_POLL_WINDOW_SECONDS: "900"

      # ---------------------------------------------------------------------
      # BIR SEFERLIK production pin'leri.
      #
      # Bu sayilar YALNIZCA bu tek seferlik rollout dogrulamasinda beklenir ve
      # kasitli olarak workflow icinde tutulur. Canonical karar sahibine
      # (PersonelAccountOnboardingService) veya report owner'ina GOMULMEZ: orada
      # sayi beklemek, cohort degistiginde gercek veriyi "beklenen" degere
      # uydurmaya calisan bir fail-open yolu olurdu. Burada gate, kanit
      # beklenenden saparsa isi DURDURUR.
      #
      # TUREV: EXCLUDED_TOTAL = user_not_active + bound_personel_not_active
      # (4 + 5) ve diger excluded bucket'lar 0'dir. PERSONEL_TOTAL = TARGET_COUNT
      # + EXCLUDED_TOTAL (125 + 9).
      #
      # Bir sonraki rollout'ta bu pin'ler guncellenmelidir; guncellenmezse gate
      # bilincli olarak BLOCKED verir, sessizce gecmez.
      # ---------------------------------------------------------------------
      EXPECTED_PERSONEL_TOTAL: "134"
      EXPECTED_TARGET_COUNT: "125"
      EXPECTED_EXCLUDED_TOTAL: "9"
      EXPECTED_EXCLUDED_USER_NOT_ACTIVE: "4"
      EXPECTED_EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE: "5"
      EXPECTED_EXCLUDED_PROTECTED_USERNAME: "0"
      EXPECTED_EXCLUDED_BINDING_MISSING: "0"
      EXPECTED_EXCLUDED_BOUND_PERSONEL_MISSING: "0"
      EXPECTED_NAME_UNRESOLVED: "0"
      EXPECTED_NAME_CORRECTION_COUNT: "5"
      EXPECTED_BUSINESS_OVERRIDE_COUNT: "3"
      EXPECTED_COLLISION_COUNT: "0"
      EXPECTED_PROTECTED_IN_PLAN: "0"
      # Explicit business override + name correction ile beklenen plan kullanici adlari.
      EXPECTED_USERNAME_PLAN: "abdullah,fahriM,hakanAc,hakanAt,muqtadaK,oktayE,raedF,saifA"

    steps:
      # Publication boundary gate. Runs before checkout, before any FTP contact
      # and before any control-plane request, so a public repository never even
      # asks production for a credential rollout plan. The value comes from
      # GitHub's canonical repository context, not from an input, and anything
      # other than an explicit "true" (including a missing context on an
      # unexpected event) blocks: default-deny, not default-publish.
      - name: Validate repository publication boundary
        run: |
          set -euo pipefail
          if [ "${REPOSITORY_PRIVATE:-}" != "true" ]; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=PUBLIC_REPOSITORY_ARTIFACT_EXPOSURE"
            exit 1
          fi

      - name: Validate explicit request
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "$MODE" || {
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=CONFIRMATION_MISMATCH"
            exit 1
          }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=DEPLOYED_SHA_INPUT_INVALID"
            exit 1
          }
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing." && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing." && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing." && exit 1)
          test "$FTP_PORT" = "21" || (echo "FTP_PORT must be 21 for this cPanel FTP deploy." && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FTP client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Collect read-only personel first-login preflight
        run: |
          set -euo pipefail

          run_cpanel_plain_ftp() {
            local ftp_commands="$1"

            echo "Deploy transport mode: plain-ftp"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow false;
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            run_cpanel_plain_ftp "$1"
          }

          block() {
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=$1"
            exit 1
          }

          source "$GITHUB_WORKSPACE/scripts/deploy/cpanel-ftp-directory-lib.sh"

          WORK="$RUNNER_TEMP/personel-first-login-preflight"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          if ! ensure_cpanel_remote_directory "api/runtime/migration-control"; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=CONTROL_PLANE_DIRECTORY_UNUSABLE"
            run_cpanel_ftp "cls -1 api/runtime/migration-control;" >/dev/null 2>&1 || true
            exit 1
          fi

          # Deploy SHA parity: the report must be produced by the exact code the
          # caller authorized, otherwise the numbers describe an unknown owner.
          if ! run_cpanel_ftp "
            get api/.deploy-sha -o ${WORK}/deploy-sha.txt;
            get api/bin/cpanel-migration-cron.php -o ${WORK}/remote-worker.php;
          " >/dev/null 2>&1; then
            block CONTROL_PLANE_UNREACHABLE
          fi
          remote_sha="$(tr -d '\r\n' < "${WORK}/deploy-sha.txt" 2>/dev/null || true)"
          [[ "${remote_sha,,}" == "${DEPLOYED_SHA,,}" ]] || block DEPLOY_SHA_MISMATCH
          echo "PREFLIGHT_DEPLOY_SHA_MATCH=YES"

          # Worker parity + mode ownership. A deployed worker that is not this
          # branch's worker either does not know the read-only mode or is not the
          # reviewed read-only implementation, so no request is written for it.
          local_worker_sha="$(sha256sum api/bin/cpanel-migration-cron.php | cut -d' ' -f1)"
          remote_worker_sha="$(sha256sum "${WORK}/remote-worker.php" | cut -d' ' -f1)"
          [[ "$local_worker_sha" == "$remote_worker_sha" ]] || block REMOTE_WORKER_PARITY_MISMATCH
          grep -q 'PERSONEL_FIRST_LOGIN_CREDENTIALS_PREFLIGHT' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_MODE_MISSING
          grep -q 'PersonelFirstLoginCredentialsPreflightReport' "${WORK}/remote-worker.php" \
            || block REMOTE_WORKER_REPORT_OWNER_MISSING
          # The read-only mode must have no apply sibling on the deployed worker.
          if grep -q 'PERSONEL_FIRST_LOGIN_CREDENTIALS_APPLY' "${WORK}/remote-worker.php"; then
            block UNEXPECTED_PERSONEL_FIRST_LOGIN_APPLY_MODE
          fi
          echo "PREFLIGHT_WORKER_PARITY=YES"
          echo "PREFLIGHT_APPLY_MODE_ABSENT=YES"

          # Busy guard: the preflight shares the control plane with apply and with
          # the mapping operations, so it must never queue behind or race another
          # request.
          listing="$WORK/control-listing.txt"
          if ! run_cpanel_ftp "cls -1 api/runtime/migration-control > ${listing};" >/dev/null 2>&1; then
            block CONTROL_PLANE_UNREACHABLE
          fi
          if grep -q 'request\.pending\.' "$listing"; then
            block MIGRATION_CONTROL_PLANE_BUSY
          fi
          if grep -q 'request\.processing\.' "$listing"; then
            block MIGRATION_CONTROL_PLANE_BUSY
          fi
          if grep -q '/status.json$' "$listing"; then
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${WORK}/status.json;" >/dev/null 2>&1; then
              if [[ "$(jq -r '.state // empty' "${WORK}/status.json" 2>/dev/null || true)" == "RUNNING" ]]; then
                block WORKER_BUSY
              fi
            fi
          fi
          echo "PREFLIGHT_WORKER_IDLE=YES"

          # Every request file already present is listed before the write, so the
          # request this step submits is provably the only new control-plane entry.
          echo "PREFLIGHT_CONTROL_PLANE_FILES_BEFORE=$(grep -c 'request\.' "$listing" || true)"

          REQUEST_ID="pflcpre-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PREFLIGHT_REQUEST_ID=${REQUEST_ID}"
          request_dir="$WORK/request"
          mkdir -p "$request_dir"
          # The request carries a mode and a SHA and nothing else: no personel id,
          # no username, no SQL, no filter and no apply flag. There is no field an
          # operator could use to ask for a mutation.
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 1, request_id: $request_id, deployed_sha: $deployed_sha, requested_at: $requested_at, mode: "PERSONEL_FIRST_LOGIN_CREDENTIALS_PREFLIGHT"}' \
            > "$request_dir/request.${REQUEST_ID}.tmp"

          run_cpanel_ftp "
            lcd ${request_dir};
            put -O api/runtime/migration-control request.${REQUEST_ID}.tmp;
            mv api/runtime/migration-control/request.${REQUEST_ID}.tmp api/runtime/migration-control/request.pending.${REQUEST_ID}.json;
          "

          status_file="$WORK/poll-status.json"
          deadline="$(( $(date +%s) + TOTAL_POLL_WINDOW_SECONDS ))"
          worker_state="NONE"
          for _ in $(seq 1 "$POLL_ATTEMPTS"); do
            rm -f "$status_file"
            if run_cpanel_ftp "get api/runtime/migration-control/status.json -o ${status_file};" >/dev/null 2>&1; then
              if [[ "$(jq -r '.request_id // empty' "$status_file" 2>/dev/null || true)" == "$REQUEST_ID" ]]; then
                worker_state="$(jq -r '.state // "NONE"' "$status_file" 2>/dev/null || echo NONE)"
                if [[ "$worker_state" == "SUCCEEDED" || "$worker_state" == "FAILED" ]]; then
                  break
                fi
              fi
            fi
            if (( $(date +%s) >= deadline )); then
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "PREFLIGHT_WORKER_STATE=${worker_state}"
          if [[ "$worker_state" == "FAILED" ]]; then
            reason="$(jq -r 'if (.reason | type) == "string" and (.reason | test("^[A-Z0-9_]+$")) then .reason else "UNKNOWN_PREFLIGHT_FAILURE" end' "$status_file" 2>/dev/null || echo UNKNOWN_PREFLIGHT_FAILURE)"
            stage="$(jq -r 'if (.stage | type) == "string" and (.stage | test("^[A-Z0-9_]+$")) then .stage else "UNKNOWN" end' "$status_file" 2>/dev/null || echo UNKNOWN)"
            echo "PREFLIGHT_STAGE=${stage}"
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=${reason}"
            exit 1
          fi
          if [[ "$worker_state" != "SUCCEEDED" ]]; then
            block WAITING_FOR_CRON_TICK
          fi

          report="$WORK/personel-first-login-preflight.json"
          if ! run_cpanel_ftp "get api/runtime/migration-control/personel-first-login-preflight.json -o ${report};" >/dev/null 2>&1; then
            block PREFLIGHT_REPORT_UNREADABLE
          fi

          # The report must be the one this request produced, pinned to the same
          # SHA, otherwise a stale report from an earlier run would be read as
          # this run's evidence.
          [[ "$(jq -r '.request_id // ""' "$report" 2>/dev/null || true)" == "$REQUEST_ID" ]] || block PREFLIGHT_REPORT_REQUEST_MISMATCH
          [[ "$(jq -r '.deployed_sha // ""' "$report" 2>/dev/null || true)" == "${DEPLOYED_SHA,,}" ]] || block PREFLIGHT_REPORT_SHA_MISMATCH
          [[ "$(jq -r '.mode // ""' "$report" 2>/dev/null || true)" == "$MODE" ]] || block PREFLIGHT_REPORT_MODE_MISMATCH

          # Read-only proof, straight from the decision the report reduced: the
          # canonical owner was called with apply = false, so it can neither claim
          # a write nor report an applied row count, and this mode declares zero
          # production mutations.
          [[ "$(jq -r '.decision_apply' "$report" 2>/dev/null || echo true)" == "false" ]] || block READ_ONLY_PROOF_DECISION_APPLY
          [[ "$(jq -r '.decision_applied_count' "$report" 2>/dev/null || echo -1)" == "0" ]] || block READ_ONLY_PROOF_APPLIED_COUNT
          [[ "$(jq -r '.production_mutation_count' "$report" 2>/dev/null || echo -1)" == "0" ]] || block READ_ONLY_PROOF_MUTATION_COUNT
          echo "READ_ONLY_PROOF=APPLY_FALSE_APPLIED_COUNT_ZERO_MUTATION_COUNT_ZERO"

          mkdir -p "$GITHUB_WORKSPACE/preflight-artifact"
          cp "$report" "$GITHUB_WORKSPACE/preflight-artifact/personel-first-login-preflight.json"

          # Bounded, allowlisted summary. Plan rows stay in the artifact; only
          # counts, the expected-username match and reason codes reach this log.
          # The fallback triggers on a missing field only. `a // b` would also fire
          # on `false`, which printed every false boolean as NONE and made an
          # absent field indistinguishable from a proven negative.
          emit_scalar() {
            local label="$1"
            local filter="$2"
            local pattern="$3"
            local value
            value="$(jq -r "${filter} | if . == null then \"NONE\" else tostring end" "$report" 2>/dev/null || echo NONE)"
            [[ "$value" =~ $pattern ]] || value="NONE"
            echo "${label}=${value}"
          }

          emit_scalar PREFLIGHT_SCHEMA_VERSION '.schema_version' '^[0-9]{1,3}$'
          emit_scalar PREFLIGHT_GENERATED_AT '.generated_at' '^[0-9TZ:.+-]{1,64}$'
          emit_scalar PREFLIGHT_DEPLOY_SHA '.deployed_sha' '^[0-9a-f]{40}$'
          emit_scalar PERSONEL_TOTAL '.personel_total' '^-?[0-9]{1,12}$'
          emit_scalar TARGET_COUNT '.target_count' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_TOTAL '.excluded_total' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_USER_NOT_ACTIVE '.excluded_counts.user_not_active' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE '.excluded_counts.bound_personel_not_active' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_PROTECTED_USERNAME '.excluded_counts.protected_username' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BINDING_MISSING '.excluded_counts.binding_missing' '^-?[0-9]{1,12}$'
          emit_scalar EXCLUDED_BOUND_PERSONEL_MISSING '.excluded_counts.bound_personel_missing' '^-?[0-9]{1,12}$'
          emit_scalar NAME_UNRESOLVED_COUNT '.name_unresolved_count' '^-?[0-9]{1,12}$'
          emit_scalar COLLISION_COUNT '.collision_count' '^-?[0-9]{1,12}$'
          emit_scalar NAME_CORRECTION_COUNT '.name_correction_count' '^-?[0-9]{1,12}$'
          emit_scalar NAME_CORRECTION_PREIMAGE_MISMATCH_COUNT '.name_correction_preimage_mismatch_count' '^-?[0-9]{1,12}$'
          emit_scalar BUSINESS_OVERRIDE_COUNT '.business_override_count' '^-?[0-9]{1,12}$'
          emit_scalar COHORT_RECONCILED '.cohort_reconciled' '^(true|false)$'
          emit_scalar PROTECTED_USERNAME_IN_PLAN_COUNT '.protected_username_in_plan_count' '^-?[0-9]{1,12}$'
          emit_scalar ILKERA_TOUCHED '.ilkera_touched' '^(true|false)$'
          emit_scalar PREFLIGHT_BLOCKER_COUNT '[.blockers[]?] | length' '^[0-9]{1,6}$'
          emit_scalar PREFLIGHT_RESULT '.result' '^(PASS|BLOCKED)$'

          if [[ "$(jq -r '.result // "BLOCKED"' "$report" 2>/dev/null || echo BLOCKED)" != "PASS" ]]; then
            echo "PREFLIGHT_BLOCKERS=$(jq -r '[.blockers[]? | tostring] | join(",")' "$report" 2>/dev/null | tr -cd 'A-Z0-9_,' || true)"
            echo "PREFLIGHT_PLAN_READY=NO"
            exit 1
          fi
          echo "PREFLIGHT_PLAN_READY=YES"

      # One-time production expectations, hard fail-closed. This gate runs only
      # after the read-only proof above, and it never writes anything anywhere: a
      # mismatch stops the workflow so the operator re-derives the expectation
      # instead of proceeding on drifted numbers.
      - name: Enforce one-time production expectations
        run: |
          set -euo pipefail

          report="$GITHUB_WORKSPACE/preflight-artifact/personel-first-login-preflight.json"
          [[ -f "$report" ]] || {
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=PREFLIGHT_REPORT_NOT_PUBLISHED"
            exit 1
          }

          gate() {
            local label="$1"
            local filter="$2"
            local expected="$3"
            local actual
            actual="$(jq -r "${filter} | if . == null then \"NONE\" else tostring end" "$report" 2>/dev/null || echo NONE)"
            if [[ "$actual" != "$expected" ]]; then
              echo "EXPECTED_GATE_${label}=MISMATCH"
              echo "EXPECTED_GATE_${label}_EXPECTED=${expected}"
              echo "EXPECTED_GATE_${label}_ACTUAL=${actual}"
              echo "PREFLIGHT_RESULT=BLOCKED"
              echo "PREFLIGHT_REASON=PRODUCTION_EXPECTATION_MISMATCH_${label}"
              exit 1
            fi
            echo "EXPECTED_GATE_${label}=MATCH"
          }

          gate PERSONEL_TOTAL '.personel_total' "$EXPECTED_PERSONEL_TOTAL"
          gate TARGET_COUNT '.target_count' "$EXPECTED_TARGET_COUNT"
          gate EXCLUDED_TOTAL '.excluded_total' "$EXPECTED_EXCLUDED_TOTAL"
          gate EXCLUDED_USER_NOT_ACTIVE '.excluded_counts.user_not_active' "$EXPECTED_EXCLUDED_USER_NOT_ACTIVE"
          gate EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE '.excluded_counts.bound_personel_not_active' "$EXPECTED_EXCLUDED_BOUND_PERSONEL_NOT_ACTIVE"
          gate EXCLUDED_PROTECTED_USERNAME '.excluded_counts.protected_username' "$EXPECTED_EXCLUDED_PROTECTED_USERNAME"
          gate EXCLUDED_BINDING_MISSING '.excluded_counts.binding_missing' "$EXPECTED_EXCLUDED_BINDING_MISSING"
          gate EXCLUDED_BOUND_PERSONEL_MISSING '.excluded_counts.bound_personel_missing' "$EXPECTED_EXCLUDED_BOUND_PERSONEL_MISSING"
          gate NAME_UNRESOLVED_COUNT '.name_unresolved_count' "$EXPECTED_NAME_UNRESOLVED"
          gate NAME_CORRECTION_COUNT '.name_correction_count' "$EXPECTED_NAME_CORRECTION_COUNT"
          gate NAME_CORRECTION_PREIMAGE_MISMATCH_COUNT '.name_correction_preimage_mismatch_count' "0"
          gate BUSINESS_OVERRIDE_COUNT '.business_override_count' "$EXPECTED_BUSINESS_OVERRIDE_COUNT"
          gate COLLISION_COUNT '.collision_count' "$EXPECTED_COLLISION_COUNT"
          gate PROTECTED_USERNAME_IN_PLAN_COUNT '.protected_username_in_plan_count' "$EXPECTED_PROTECTED_IN_PLAN"
          gate COHORT_RECONCILED '.cohort_reconciled' "true"
          gate ILKERA_TOUCHED '.ilkera_touched' "false"
          gate DECISION_APPLY '.decision_apply' "false"
          gate DECISION_APPLIED_COUNT '.decision_applied_count' "0"
          gate PRODUCTION_MUTATION_COUNT '.production_mutation_count' "0"
          gate PREFLIGHT_RESULT '.result' "PASS"
          gate BLOCKER_COUNT '[.blockers[]?] | length' "0"

          # The rollout's business truth: the override/correction accounts must be
          # in the plan with the canonical usernames, and every plan username must
          # be unique (a duplicate would mean a plan the apply owner cannot run).
          actual_usernames="$(jq -r '[.plan[]?.new_username | strings] | unique | sort | join(",")' "$report" 2>/dev/null || echo "")"
          plan_rows="$(jq -r '[.plan[]?] | length' "$report" 2>/dev/null || echo -1)"
          unique_usernames="$(jq -r '[.plan[]?.new_username | strings] | unique | length' "$report" 2>/dev/null || echo -1)"
          [[ "$plan_rows" == "$unique_usernames" ]] || {
            echo "EXPECTED_GATE_PLAN_USERNAME_UNIQUE=MISMATCH"
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=PLAN_USERNAME_NOT_UNIQUE"
            exit 1
          }
          echo "EXPECTED_GATE_PLAN_USERNAME_UNIQUE=MATCH"

          for username in ${EXPECTED_USERNAME_PLAN//,/ }; do
            if ! printf '%s' ",${actual_usernames}," | grep -qF ",${username},"; then
              echo "EXPECTED_GATE_USERNAME_${username}=MISSING"
              echo "PREFLIGHT_RESULT=BLOCKED"
              echo "PREFLIGHT_REASON=EXPECTED_USERNAME_MISSING"
              exit 1
            fi
            echo "EXPECTED_GATE_USERNAME_${username}=PRESENT"
          done

          echo "PREFLIGHT_RESULT=PASS"
          echo "PREFLIGHT_REASON=NONE"

      # The control plane must be back to its pre-run shape plus exactly one new
      # artifact: this mode's report. A leftover request.pending/processing file
      # would mean the worker died mid-request, which is itself evidence that the
      # read-only surface is not healthy.
      - name: Verify control plane is left clean
        if: success()
        run: |
          set -euo pipefail

          request_id="pflcpre-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work="$RUNNER_TEMP/personel-first-login-final"
          rm -rf "$work"
          mkdir -p "$work"

          run_cpanel_plain_ftp() {
            local ftp_commands="$1"

            echo "Deploy transport mode: plain-ftp"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "ftp://${FTP_SERVER}" -e "
              set cmd:fail-exit true;
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 10;
              set xfer:clobber true;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:passive-mode on;
              set ftp:ssl-allow false;
              set ftp:ssl-force false;
              set ftp:ssl-protect-data false;
              ${ftp_commands}
              bye
            "
          }

          run_cpanel_ftp() {
            run_cpanel_plain_ftp "$1"
          }

          if ! run_cpanel_ftp "cls -1 api/runtime/migration-control > ${work}/control-listing-after.txt;" >/dev/null 2>&1; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=FINAL_CONTROL_PLANE_UNREACHABLE"
            exit 1
          fi
          if grep -q 'request\.pending\.' "${work}/control-listing-after.txt"; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=LEFTOVER_PENDING_REQUEST"
            exit 1
          fi
          if grep -q 'request\.processing\.' "${work}/control-listing-after.txt"; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=LEFTOVER_PROCESSING_REQUEST"
            exit 1
          fi
          if grep -q 'request\.failed\.' "${work}/control-listing-after.txt"; then
            echo "PREFLIGHT_RESULT=BLOCKED"
            echo "PREFLIGHT_REASON=FAILED_REQUEST_PRESENT"
            exit 1
          fi
          grep -qF "request.completed.${request_id}.json" "${work}/control-listing-after.txt" \
            || {
              echo "PREFLIGHT_RESULT=BLOCKED"
              echo "PREFLIGHT_REASON=REQUEST_NOT_ARCHIVED"
              exit 1
            }

          echo "PREFLIGHT_CONTROL_PLANE_CLEAN=YES"

      - name: Publish preflight artifact
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v6
        with:
          name: personel-first-login-preflight
          path: preflight-artifact/
          retention-days: 7
          if-no-files-found: warn
